name: Provider Sentinel Watchdog
run-name: Provider Sentinel Watchdog ${{ github.event_name }} ${{ github.run_id }}

on:
  workflow_dispatch:
  # GitHub cron is only the recovery path. The resident ticker below owns the
  # five-minute cadence and rearms its successor before the six-hour job limit.
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: provider-sentinel-watchdog-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  actions: write
  contents: write

jobs:
  ticker:
    if: vars.SENTINEL_AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch incident scans every five minutes
        shell: bash
        run: |
          set -euo pipefail
          dispatch_failures=0
          for iteration in $(seq 1 67); do
            next_tick_epoch=$(( $(date +%s) + 300 ))
            slot="$(date -u +%Y%m%dT%H%M%SZ)"
            signal_id="watchdog-${GITHUB_RUN_ID}-${iteration}-${slot}"
            dispatched=false
            for attempt in 1 2 3; do
              if timeout 30s gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/dispatches" \
                -f event_type=provider_incident \
                -f "client_payload[signal_id]=${signal_id}"; then
                dispatched=true
                break
              fi
              sleep 10
            done
            if [ "$dispatched" != true ]; then
              echo "::error::Provider Sentinel watchdog could not dispatch ${signal_id}."
              dispatch_failures=$((dispatch_failures + 1))
            else
              echo "Dispatched ${signal_id} at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            fi
            while [ "$(date +%s)" -lt "$next_tick_epoch" ]; do
              remaining=$((next_tick_epoch - $(date +%s)))
              if [ "$remaining" -gt 60 ]; then
                sleep 60
              elif [ "$remaining" -gt 0 ]; then
                sleep "$remaining"
              fi
            done
          done
          if [ "$dispatch_failures" -gt 0 ]; then
            echo "::error::Provider Sentinel watchdog missed ${dispatch_failures} incident dispatches."
            exit 1
          fi

      - name: Rearm the resident watchdog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          queued=""
          for attempt in 1 2 3; do
            if queued="$(
              timeout 30s gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/provider-sentinel-watchdog.yml/runs?per_page=100" \
                --jq '[.workflow_runs[] | select((.id | tostring) != env.GITHUB_RUN_ID and (.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested"))] | length'
            )"; then
              break
            fi
            queued=""
            sleep 10
          done
          if ! [[ "$queued" =~ ^[0-9]+$ ]]; then
            echo "::error::Provider Sentinel watchdog could not inspect queued successors."
            exit 1
          fi
          if [ "$queued" -gt 0 ]; then
            echo "A queued watchdog successor already exists."
            exit 0
          fi
          for attempt in 1 2 3; do
            if timeout 30s gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/provider-sentinel-watchdog.yml/dispatches" \
              -f ref=development; then
              echo "Dispatched the next resident watchdog."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Provider Sentinel watchdog could not dispatch its successor."
          exit 1
