name: Deno Deploy

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@codex/deno-2-programmatic
    with:
      project: ai-ubq-fi
      deploy_platform: deno2
      entrypoint: serve.ts
      install_command: deno install
      build_command: deno task build
      runtime_env: |
        DENO_DEPLOY_TOKEN=$DENO_DEPLOY_TOKEN
        UOS_AI_TOKEN=$UBIQUITY_AI_USER_TOKEN
      index_html_path: static/docs.html
      extra_paths: |
        /app.js
        /docs
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
    secrets: inherit

  sync-ai-runtime-env:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Resolve Deno app URL
        id: deploy-target
        shell: bash
        env:
          PROJECT: ai-ubq-fi
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          DENO_DEPLOY_ORG: ubiquity-dao
        run: |
          set -euo pipefail

          target="$PROJECT"
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base="${PROJECT%-ubq-fi}"
            if [ ${#base} -gt 17 ]; then
              hash="$(printf '%s' "$base" | sha1sum | cut -c1-4)"
              base="${base:0:12}-${hash}"
            fi
            target="p-${base}-ubq-fi"
          fi

          echo "app=$target" >> "$GITHUB_OUTPUT"
          echo "url=https://${target}.${DENO_DEPLOY_ORG}.deno.net" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy-target.outputs.url }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            http_code="$(curl -sS -L -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || echo "000")"
            if [ "$http_code" = "200" ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "::error::Deployment did not become reachable at $DEPLOY_URL"
          exit 1

      - name: Sync AI runtime env
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ubiquity-dao
          DENO_DEPLOY_APP: ${{ steps.deploy-target.outputs.app }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 || vars.CODEX_AUTH_JSON_B64 || '' }}
          UOS_AI_KERNEL_PUBLIC_KEY: ${{ secrets.UOS_AI_KERNEL_PUBLIC_KEY || secrets.UBIQUITY_AI_KERNEL_PUBLIC_KEY || vars.UOS_AI_KERNEL_PUBLIC_KEY || vars.UBIQUITY_AI_KERNEL_PUBLIC_KEY || '' }}
          VOYAGEAI_API_KEY: ${{ secrets.VOYAGEAI_API_KEY || vars.VOYAGEAI_API_KEY || '' }}
        run: |
          set -euo pipefail

          sync_value() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ]; then
              return 0
            fi

            while IFS= read -r mask_line; do
              [ -n "$mask_line" ] && echo "::add-mask::$mask_line"
            done <<< "$value"
            local cli_value="$value"
            case "$cli_value" in
              -*) cli_value=" $cli_value" ;;
            esac

            set +e
            output="$(deno deploy env update-value "$key" "$cli_value" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1)"
            status=$?
            set -e
            if [ $status -eq 0 ]; then
              echo "$output"
              return 0
            fi

            if printf '%s\n' "$output" | grep -qi "not found"; then
              deno deploy env add "$key" "$cli_value" --secret --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP"
              return 0
            fi

            echo "$output"
            return $status
          }

          sync_secret() {
            local key="$1"
            sync_value "$key" "${!key:-}"
          }

          if [ -z "$CODEX_AUTH_JSON_B64" ]; then
            echo "::error::CODEX_AUTH_JSON_B64 is required for Codex auth runtime env."
            exit 1
          fi

          codex_auth_minified="$(
            deno eval '
            const raw = Deno.env.get("CODEX_AUTH_JSON_B64") ?? "";
            const bytes = Uint8Array.from(atob(raw.trim().replace(/\s+/g, "")), (ch) => ch.charCodeAt(0));
            const parsed = JSON.parse(new TextDecoder().decode(bytes));
            const tokens = parsed?.tokens;
            if (
              typeof tokens?.access_token !== "string" ||
              typeof tokens?.refresh_token !== "string" ||
              typeof tokens?.account_id !== "string"
            ) {
              console.error("CODEX_AUTH_JSON_B64 does not look like a Codex auth.json.");
              Deno.exit(1);
            }
            const minimal = {
              tokens: {
                access_token: tokens.access_token,
                refresh_token: tokens.refresh_token,
                account_id: tokens.account_id,
              },
            };
            const encoded = new TextEncoder().encode(JSON.stringify(minimal));
            let binary = "";
            for (const byte of encoded) binary += String.fromCharCode(byte);
            console.log(btoa(binary));
            '
          )"
          echo "::add-mask::$codex_auth_minified"
          if [ ${#codex_auth_minified} -gt 4096 ]; then
            echo "::error::Minified CODEX_AUTH_JSON_B64 is still too large for Deno Deploy app env (${#codex_auth_minified} > 4096)."
            exit 1
          fi

          sync_value CODEX_AUTH_JSON_B64 "$codex_auth_minified"
          sync_secret UOS_AI_KERNEL_PUBLIC_KEY
          sync_secret VOYAGEAI_API_KEY
