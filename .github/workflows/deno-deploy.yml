name: Deno Deploy

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@main
    with:
      project: ai-ubq-fi
      entrypoint: serve.ts
      include: |
        codex_instructions.md
      env_var_keys: |
        CODEX_AUTH_JSON_B64
        UBQ_AI_AUTH_TOKENS
        UBQ_AI_ADMIN_TOKENS
      extra_paths: |
        /health
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
        CODEX_AUTH_JSON_B64
        UBQ_AI_AUTH_TOKENS
    secrets: inherit
