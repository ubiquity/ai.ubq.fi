name: Deno Deploy

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy the current non-production ref to p-ai-ubq-fi
        required: false
        type: boolean
        default: false

concurrency:
  # Every deployment mutates either the production app or the shared preview
  # app. Queue all runs so a later preview cannot race an earlier one.
  group: ai-ubq-fi-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno task build
      - run: deno task test

      - name: Package immutable source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/source
          git archive --format=tar --output=.release/git-source.tar "$GITHUB_SHA"
          tar -xf .release/git-source.tar -C .release/source
          GITHUB_SHA="$GITHUB_SHA" deno eval \
            '
              const gitSha = Deno.env.get("GITHUB_SHA");
              if (!gitSha || !/^[0-9a-f]{40}$/.test(gitSha)) {
                throw new Error("GITHUB_SHA must be a full Git commit SHA");
              }
              Deno.writeTextFileSync(
                ".release/source/src/release.ts",
                `// Generated for this immutable deployment artifact.\nexport const RELEASE_GIT_SHA = "${gitSha}";\n`,
              );
            '
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -cf .release/.uos-source.tar \
            -C .release/source \
            .
          source_digest="$(sha256sum .release/.uos-source.tar | awk '{print $1}')"
          mv .release/.uos-source.tar .release/source/.uos-source.tar
          SOURCE_DIGEST="$source_digest" GITHUB_SHA="$GITHUB_SHA" deno eval \
            '
              const manifest = {
                git_sha: Deno.env.get("GITHUB_SHA"),
                source_archive_sha256: Deno.env.get("SOURCE_DIGEST"),
              };
              Deno.writeTextFileSync(
                ".release/source/.uos-release.json",
                `${JSON.stringify(manifest, null, 2)}\n`,
              );
            '
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "Source archive SHA-256: \`$source_digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable source
        uses: actions/upload-artifact@v4
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .release/source
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  verify-artifact:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download immutable source
        uses: actions/download-artifact@v4
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .deploy-artifact
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}

      - name: Verify immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          archive=".deploy-artifact/.uos-source.tar"
          manifest=".deploy-artifact/.uos-release.json"
          test -f "$archive"
          test -f "$manifest"

          manifest_sha="$(jq -er '.git_sha' "$manifest")"
          expected_digest="$(jq -er '.source_archive_sha256' "$manifest")"
          actual_digest="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$manifest_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Artifact manifest git_sha ${manifest_sha} does not match ${GITHUB_SHA}."
            exit 1
          fi
          if [ "$actual_digest" != "$expected_digest" ]; then
            echo "::error::Artifact source digest ${actual_digest} does not match ${expected_digest}."
            exit 1
          fi
          baked_release_line="export const RELEASE_GIT_SHA = \"${GITHUB_SHA}\";"
          grep -Fx "$baked_release_line" ".deploy-artifact/src/release.ts"
          tar -xOf "$archive" ./src/release.ts | grep -Fx "$baked_release_line"
          {
            echo "### Immutable artifact"
            echo ""
            echo "- Git SHA: \`${manifest_sha}\`"
            echo "- Source archive SHA-256: \`${actual_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  production-approval:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production deployment approved."

  configure-secrets:
    needs:
      - validate
      - verify-artifact
      - production-approval
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.verify-artifact.result == 'success' &&
      (
        (github.ref == 'refs/heads/development' && needs.production-approval.result == 'success') ||
        (
          github.ref != 'refs/heads/development' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_preview == 'true'
        )
      )
    runs-on: ubuntu-latest
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      TARGET_PROJECT: ${{ github.ref == 'refs/heads/development' && 'ai-ubq-fi' || 'p-ai-ubq-fi' }}
      UOS_AI_TOKEN: ${{ secrets.UBIQUITY_AI_USER_TOKEN }}
      UOS_AI_KERNEL_PUBLIC_KEY: ${{ secrets.UBIQUITY_AI_KERNEL_PUBLIC_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      VOYAGEAI_API_KEY: ${{ secrets.VOYAGEAI_API_KEY }}
      METERED_API_KEY: ${{ secrets.METERED_API_KEY }}
      OPENLUX_API_KEY: ${{ secrets.OPENLUX_API_KEY }}
      SURPLUS_API_KEY: ${{ secrets.SURPLUS_API_KEY }}
      METERED_SYSTEM_TOKEN: ${{ secrets.METERED_SYSTEM_TOKEN }}
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure target application secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$DENO_DEPLOY_TOKEN" ]
          [ -n "$UOS_AI_TOKEN" ]
          [ -n "$METERED_API_KEY" ] || [ -n "$OPENLUX_API_KEY" ] || [ -n "$SURPLUS_API_KEY" ]
          echo "::add-mask::$DENO_DEPLOY_TOKEN"

          deno eval \
            '
              const required = ["UOS_AI_TOKEN"];
              const optional = [
                "METERED_API_KEY",
                "OPENLUX_API_KEY",
                "SURPLUS_API_KEY",
                "UOS_AI_KERNEL_PUBLIC_KEY",
                "CEREBRAS_API_KEY",
                "VOYAGEAI_API_KEY",
                "METERED_SYSTEM_TOKEN",
              ];
              const lines = [];
              for (const name of [...required, ...optional]) {
                const value = Deno.env.get(name)?.trim() ?? "";
                if (!value) {
                  if (required.includes(name)) throw new Error(`${name} is required`);
                  continue;
                }
                lines.push(`${name}=${JSON.stringify(value)}`);
              }
              if (
                !Deno.env.get("METERED_API_KEY")?.trim() &&
                !Deno.env.get("OPENLUX_API_KEY")?.trim() &&
                !Deno.env.get("SURPLUS_API_KEY")?.trim()
              ) {
                throw new Error("METERED_API_KEY, OPENLUX_API_KEY, or SURPLUS_API_KEY is required");
              }
              Deno.writeTextFileSync(".uos-deploy-secrets.env", `${lines.join("\n")}\n`, {
                mode: 0o600,
              });
            '

          deno deploy env load \
            --json \
            --non-interactive \
            --replace \
            --org ubiquity-dao \
            --app "$TARGET_PROJECT" \
            --token "$DENO_DEPLOY_TOKEN" \
            .uos-deploy-secrets.env |
            jq '{added, updated, skipped}'

  capture-deployment-baseline:
    needs:
      - validate
      - verify-artifact
      - production-approval
      - configure-secrets
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.verify-artifact.result == 'success' &&
      needs.configure-secrets.result == 'success' &&
      (
        (github.ref == 'refs/heads/development' && needs.production-approval.result == 'success') ||
        (
          github.ref != 'refs/heads/development' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_preview == 'true'
        )
      )
    runs-on: ubuntu-latest
    outputs:
      revision_ids: ${{ steps.capture.outputs.revision_ids }}
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      TARGET_PROJECT: ${{ github.ref == 'refs/heads/development' && 'ai-ubq-fi' || 'p-ai-ubq-fi' }}
    steps:
      - name: Capture existing Deno revision IDs
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$DENO_DEPLOY_TOKEN" ] || {
            echo "::error::DENO_DEPLOY_TOKEN is required to capture the deployment baseline."
            exit 1
          }
          echo "::add-mask::$DENO_DEPLOY_TOKEN"

          revisions="$(curl --fail-with-body -sS --max-time 30 \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            "https://api.deno.com/v2/apps/${TARGET_PROJECT}/revisions?limit=50")"
          printf '%s' "$revisions" | jq -e \
            'type == "array" and all(.[]; .id | type == "string" and length > 0)' \
            >/dev/null || {
              echo "::error::Deno returned an invalid revision baseline for ${TARGET_PROJECT}."
              exit 1
            }
          revision_ids="$(printf '%s' "$revisions" | jq -cer 'map(.id)')"
          echo "revision_ids=$revision_ids" >> "$GITHUB_OUTPUT"
          revision_count="$(printf '%s' "$revision_ids" | jq 'length')"
          echo "Captured ${revision_count} pre-deploy revision IDs for ${TARGET_PROJECT}." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs:
      - validate
      - verify-artifact
      - production-approval
      - configure-secrets
      - capture-deployment-baseline
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.verify-artifact.result == 'success' &&
      (
        needs.configure-secrets.result == 'success' ||
        (github.event_name == 'pull_request' && needs.configure-secrets.result == 'skipped')
      ) &&
      (
        needs.capture-deployment-baseline.result == 'success' ||
        (github.event_name == 'pull_request' && needs.capture-deployment-baseline.result == 'skipped')
      ) &&
      (
        (github.ref == 'refs/heads/development' && needs.production-approval.result == 'success') ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.ref != 'refs/heads/development' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_preview == 'true'
        )
      )
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@091927036712d54a020a3240b5b2fa492f78a94b
    with:
      project: ${{ github.ref == 'refs/heads/development' && 'ai-ubq-fi' || 'p-ai-ubq-fi' }}
      preview_project: p-ai-ubq-fi
      # p-ai-ubq-fi is a separate acceptance app. Manual preview dispatches
      # intentionally use its stable timeline so the stable hostname and
      # Deno.cron exercise the same isolated revision; PRs use unique preview
      # revision URLs and never target ai-ubq-fi.
      # A PR ref must never compare equal to the production branch. Manual
      # preview dispatches retain their existing stable-app acceptance mode.
      prod_branch: ${{ github.event_name == 'pull_request' && '__preview__' || github.ref_name }}
      deploy_platform: deno2
      entrypoint: serve.ts
      artifact_name: ai-ubq-fi-source-${{ github.sha }}
      artifact_run_id: ${{ github.run_id }}
      install_command: deno install
      build_command: deno task build
      # CODEX_AUTH_JSON_B64 is intentionally omitted. The existing app value
      # was minified and validated by the prior sync path; the pinned reusable
      # workflow cannot safely transform the raw repository secret.
      runtime_env: |
        METERED_USER_ID=${{ vars.METERED_USER_ID || '' }}
      forward_all_secrets: false
      index_html_path: static/docs.html
      extra_paths: |
        /app.js
        /docs
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
    secrets: inherit

  verify-deployment:
    needs:
      - deploy
      - capture-deployment-baseline
    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      (
        github.ref == 'refs/heads/development' ||
        (
          github.ref != 'refs/heads/development' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_preview == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Promote and verify exact deployment revision
        shell: bash
        env:
          BASELINE_REVISION_IDS: ${{ needs.capture-deployment-baseline.outputs.revision_ids }}
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          TARGET_PROJECT: ${{ github.ref == 'refs/heads/development' && 'ai-ubq-fi' || 'p-ai-ubq-fi' }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          if [ "$GITHUB_REF" = "refs/heads/development" ]; then
            [ "$TARGET_PROJECT" = "ai-ubq-fi" ] || fail "Development verification must target ai-ubq-fi."
          else
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || fail "Preview verification requires workflow_dispatch."
            [ "$TARGET_PROJECT" = "p-ai-ubq-fi" ] || fail "Preview verification must target p-ai-ubq-fi."
          fi
          [ -n "$DENO_DEPLOY_TOKEN" ] || fail "DENO_DEPLOY_TOKEN is required for deployment verification."
          echo "::add-mask::$DENO_DEPLOY_TOKEN"
          printf '%s' "$BASELINE_REVISION_IDS" | jq -e \
            'type == "array" and all(.[]; type == "string" and length > 0)' \
            >/dev/null || fail "The pre-deploy revision baseline is missing or invalid."

          stable_url="https://${TARGET_PROJECT}.ubiquity-dao.deno.net"
          custom_url=""
          if [ "$TARGET_PROJECT" = "ai-ubq-fi" ]; then
            custom_url="https://ai.ubq.fi"
          fi

          headers="$(mktemp)"
          body="$(mktemp)"
          promote_body="$(mktemp)"
          trap 'rm -f "$headers" "$body" "$promote_body"' EXIT

          last_status="000"
          last_git_sha=""
          last_deployment_id=""

          attest_health() {
            local base_url="$1"
            local expected_deployment_id="$2"
            : > "$headers"
            : > "$body"
            last_status="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' \
              "${base_url}/health" || true)"
            last_git_sha="$(awk 'tolower($1) == "x-uos-git-sha:" { gsub("\r", "", $2); print $2; exit }' "$headers")"
            last_deployment_id="$(awk 'tolower($1) == "x-uos-deployment-id:" { gsub("\r", "", $2); print $2; exit }' "$headers")"

            [ "$last_status" = "200" ] &&
              [ "$last_git_sha" = "$GITHUB_SHA" ] &&
              [ "$last_deployment_id" = "$expected_deployment_id" ] &&
              jq -e \
                --arg git_sha "$GITHUB_SHA" \
                --arg deployment_id "$expected_deployment_id" '
                  .status == "available" and
                  .release.git_sha == $git_sha and
                  .release.deployment_id == $deployment_id
                ' "$body" >/dev/null 2>&1
          }

          revision_id=""
          revision_url=""
          for attempt in $(seq 1 18); do
            if revisions="$(curl --fail-with-body -sS --max-time 30 \
              -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
              "https://api.deno.com/v2/apps/${TARGET_PROJECT}/revisions?limit=50")"; then
              printf '%s' "$revisions" | jq -e \
                'type == "array" and all(.[]; (.id | type == "string") and (.status | type == "string"))' \
                >/dev/null || fail "Deno returned an invalid revision list for ${TARGET_PROJECT}."

              mapfile -t candidate_ids < <(
                printf '%s' "$revisions" | jq -r --argjson baseline "$BASELINE_REVISION_IDS" '
                  .[] |
                  .id as $id |
                  select(($baseline | index($id)) == null) |
                  $id
                '
              )
              if [ "${#candidate_ids[@]}" -gt 1 ]; then
                fail "More than one revision appeared after the baseline; refusing an ambiguous promotion."
              fi
              if [ "${#candidate_ids[@]}" -eq 1 ]; then
                candidate_id="${candidate_ids[0]}"
                candidate_url="https://${TARGET_PROJECT}-${candidate_id}.ubiquity-dao.deno.net"
                candidate_status="$(printf '%s' "$revisions" | jq -r --arg id "$candidate_id" \
                  '.[] | select(.id == $id) | .status')"
                if [ "$candidate_status" = "succeeded" ] && attest_health "$candidate_url" "$candidate_id"; then
                  revision_id="$candidate_id"
                  revision_url="https://console.deno.com/ubiquity-dao/${TARGET_PROJECT}/builds/${revision_id}"
                  break
                fi
              fi
            fi

            echo "Waiting for the new ${TARGET_PROJECT} revision to attest ${GITHUB_SHA} (${attempt}/18)."
            sleep 10
          done

          if [ -z "$revision_id" ]; then
            fail "No unique new succeeded ${TARGET_PROJECT} revision attested ${GITHUB_SHA}."
          fi

          revisions="$(curl --fail-with-body -sS --max-time 30 \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            "https://api.deno.com/v2/apps/${TARGET_PROJECT}/revisions?limit=50")"
          mapfile -t final_candidate_ids < <(
            printf '%s' "$revisions" | jq -r --argjson baseline "$BASELINE_REVISION_IDS" '
              .[] |
              .id as $id |
              select(($baseline | index($id)) == null) |
              $id
            '
          )
          if [ "${#final_candidate_ids[@]}" -ne 1 ]; then
            fail "The post-baseline revision set changed before promotion; refusing to overwrite another deployment."
          fi
          [ "${final_candidate_ids[0]}" = "$revision_id" ] ||
            fail "The post-baseline revision identity changed before promotion."
          printf '%s' "$revisions" | jq -e --arg id "$revision_id" \
            '.[] | select(.id == $id and .status == "succeeded")' \
            >/dev/null || fail "Revision ${revision_id} is no longer in a succeeded state."

          promote_status="$(curl -sS --max-time 30 -o "$promote_body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            "https://api.deno.com/v2/revisions/${revision_id}/promote" || true)"
          [ "$promote_status" = "204" ] || {
            promote_error="$(tr '\n' ' ' < "$promote_body" | cut -c1-500)"
            fail "Deno promotion failed for ${revision_id} (HTTP ${promote_status}: ${promote_error:-empty response})."
          }

          stable_attested=false
          for attempt in $(seq 1 18); do
            if attest_health "$stable_url" "$revision_id"; then
              stable_attested=true
              break
            fi
            echo "Waiting for ${stable_url}/health to serve ${GITHUB_SHA}/${revision_id} (HTTP ${last_status}, git ${last_git_sha:-<missing>}, deployment ${last_deployment_id:-<missing>}; ${attempt}/18)."
            sleep 10
          done
          [ "$stable_attested" = "true" ] || fail "Promoted revision ${revision_id}, but the managed stable route did not converge."

          custom_health="not applicable"
          if [ -n "$custom_url" ]; then
            if attest_health "$custom_url" "$revision_id"; then
              custom_health="exact release identity attested"
            else
              cloudflare_server="$(awk 'tolower($1) == "server:" { gsub("\r", "", $2); print tolower($2); exit }' "$headers")"
              cloudflare_ray="$(awk 'tolower($1) == "cf-ray:" { gsub("\r", "", $2); print $2; exit }' "$headers")"
              cloudflare_mitigation="$(awk 'tolower($1) == "cf-mitigated:" { gsub("\r", "", $2); print tolower($2); exit }' "$headers")"
              if [ "$last_status" = "403" ] && [ "$cloudflare_server" = "cloudflare" ] &&
                [ "$cloudflare_mitigation" = "challenge" ] && [ -n "$cloudflare_ray" ]; then
                custom_health="Cloudflare challenged the GitHub runner (HTTP 403, ray ${cloudflare_ray})"
                echo "::warning::${custom_url}/health was challenged by Cloudflare Bot Fight Mode. The exact managed Deno route is attested; this is not a Deno revision mismatch."
              else
                fail "Custom deployment identity check failed for ${custom_url}/health (HTTP ${last_status}, git ${last_git_sha:-<missing>}, deployment ${last_deployment_id:-<missing>})."
              fi
            fi
          fi

          {
            echo "### Deployment attestation"
            echo ""
            echo "- Target: \`${TARGET_PROJECT}\`"
            echo "- Stable URL: ${stable_url}"
            if [ -n "$custom_url" ]; then
              echo "- Custom URL: ${custom_url}"
            fi
            echo "- Revision URL: ${revision_url}"
            echo "- Revision ID: \`${revision_id}\`"
            echo "- Git SHA: \`${GITHUB_SHA}\`"
            echo "- Promotion: HTTP ${promote_status}; exact revision pinned"
            echo "- Managed health: exact release identity attested"
            echo "- Custom health: ${custom_health}"
          } >> "$GITHUB_STEP_SUMMARY"
