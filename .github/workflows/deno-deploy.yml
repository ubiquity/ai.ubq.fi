name: Deno Deploy

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy the current non-production ref to p-ai-ubq-fi
        required: false
        type: boolean
        default: false

concurrency:
  # Every deployment mutates either the production app or the shared preview
  # app. Queue all runs so a later preview cannot race an earlier one.
  group: ai-ubq-fi-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno task build
      - run: deno task test

      - name: Package immutable source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/source
          git archive --format=tar --output=.release/git-source.tar "$GITHUB_SHA"
          tar -xf .release/git-source.tar -C .release/source
          GITHUB_SHA="$GITHUB_SHA" deno eval \
            '
              const gitSha = Deno.env.get("GITHUB_SHA");
              if (!gitSha || !/^[0-9a-f]{40}$/.test(gitSha)) {
                throw new Error("GITHUB_SHA must be a full Git commit SHA");
              }
              Deno.writeTextFileSync(
                ".release/source/src/release.ts",
                `// Generated for this immutable deployment artifact.\nexport const RELEASE_GIT_SHA = "${gitSha}";\n`,
              );
            '
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -cf .release/.uos-source.tar \
            -C .release/source \
            .
          source_digest="$(sha256sum .release/.uos-source.tar | awk '{print $1}')"
          mv .release/.uos-source.tar .release/source/.uos-source.tar
          SOURCE_DIGEST="$source_digest" GITHUB_SHA="$GITHUB_SHA" deno eval \
            '
              const manifest = {
                git_sha: Deno.env.get("GITHUB_SHA"),
                source_archive_sha256: Deno.env.get("SOURCE_DIGEST"),
              };
              Deno.writeTextFileSync(
                ".release/source/.uos-release.json",
                `${JSON.stringify(manifest, null, 2)}\n`,
              );
            '
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "Source archive SHA-256: \`$source_digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable source
        uses: actions/upload-artifact@v4
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .release/source
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  verify-artifact:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download immutable source
        uses: actions/download-artifact@v4
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .deploy-artifact
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}

      - name: Verify immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          archive=".deploy-artifact/.uos-source.tar"
          manifest=".deploy-artifact/.uos-release.json"
          test -f "$archive"
          test -f "$manifest"

          manifest_sha="$(jq -er '.git_sha' "$manifest")"
          expected_digest="$(jq -er '.source_archive_sha256' "$manifest")"
          actual_digest="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$manifest_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Artifact manifest git_sha ${manifest_sha} does not match ${GITHUB_SHA}."
            exit 1
          fi
          if [ "$actual_digest" != "$expected_digest" ]; then
            echo "::error::Artifact source digest ${actual_digest} does not match ${expected_digest}."
            exit 1
          fi
          baked_release_line="export const RELEASE_GIT_SHA = \"${GITHUB_SHA}\";"
          grep -Fx "$baked_release_line" ".deploy-artifact/src/release.ts"
          tar -xOf "$archive" ./src/release.ts | grep -Fx "$baked_release_line"
          {
            echo "### Immutable artifact"
            echo ""
            echo "- Git SHA: \`${manifest_sha}\`"
            echo "- Source archive SHA-256: \`${actual_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  production-approval:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production deployment approved."

  configure-secrets:
    needs:
      - validate
      - verify-artifact
      - production-approval
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.verify-artifact.result == 'success' &&
      (
        (github.ref == 'refs/heads/development' && needs.production-approval.result == 'success') ||
        (
          github.ref != 'refs/heads/development' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_preview == 'true'
        )
      )
    runs-on: ubuntu-latest
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      TARGET_PROJECT: ${{ github.ref == 'refs/heads/development' && 'ai-ubq-fi' || 'p-ai-ubq-fi' }}
      UOS_AI_TOKEN: ${{ secrets.UBIQUITY_AI_USER_TOKEN }}
      UOS_AI_KERNEL_PUBLIC_KEY: ${{ secrets.UBIQUITY_AI_KERNEL_PUBLIC_KEY }}
      VOYAGEAI_API_KEY: ${{ secrets.VOYAGEAI_API_KEY }}
      YUNWU_API_KEY: ${{ secrets.YUNWU_API_KEY }}
      YUNWU_SYSTEM_TOKEN: ${{ secrets.YUNWU_SYSTEM_TOKEN }}
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure target application secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$DENO_DEPLOY_TOKEN" ]
          [ -n "$UOS_AI_TOKEN" ]
          [ -n "$YUNWU_API_KEY" ]
          echo "::add-mask::$DENO_DEPLOY_TOKEN"

          deno eval \
            '
              const required = ["UOS_AI_TOKEN", "YUNWU_API_KEY"];
              const optional = [
                "UOS_AI_KERNEL_PUBLIC_KEY",
                "VOYAGEAI_API_KEY",
                "YUNWU_SYSTEM_TOKEN",
              ];
              const lines = [];
              for (const name of [...required, ...optional]) {
                const value = Deno.env.get(name)?.trim() ?? "";
                if (!value) {
                  if (required.includes(name)) throw new Error(`${name} is required`);
                  continue;
                }
                lines.push(`${name}=${JSON.stringify(value)}`);
              }
              Deno.writeTextFileSync(".uos-deploy-secrets.env", `${lines.join("\n")}\n`, {
                mode: 0o600,
              });
            '

          deno deploy env load \
            --replace \
            --json \
            --non-interactive \
            --org ubiquity-dao \
            --app "$TARGET_PROJECT" \
            --token "$DENO_DEPLOY_TOKEN" \
            .uos-deploy-secrets.env |
            jq '{added, updated, skipped}'

  deploy:
    needs:
      - validate
      - verify-artifact
      - production-approval
      - configure-secrets
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.verify-artifact.result == 'success' &&
      needs.configure-secrets.result == 'success' &&
      (
        (github.ref == 'refs/heads/development' && needs.production-approval.result == 'success') ||
        (
          github.ref != 'refs/heads/development' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_preview == 'true'
        )
      )
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@091927036712d54a020a3240b5b2fa492f78a94b
    with:
      project: ${{ github.ref == 'refs/heads/development' && 'ai-ubq-fi' || 'p-ai-ubq-fi' }}
      preview_project: p-ai-ubq-fi
      # p-ai-ubq-fi is a separate acceptance app. Its production timeline is
      # intentionally used so its stable hostname and Deno.cron both exercise
      # the same isolated revision; this never targets ai-ubq-fi.
      prod_branch: ${{ github.ref_name }}
      deploy_platform: deno2
      entrypoint: serve.ts
      artifact_name: ai-ubq-fi-source-${{ github.sha }}
      artifact_run_id: ${{ github.run_id }}
      install_command: deno install
      build_command: deno task build
      # CODEX_AUTH_JSON_B64 is intentionally omitted. The existing app value
      # was minified and validated by the prior sync path; the pinned reusable
      # workflow cannot safely transform the raw repository secret.
      runtime_env: |
        YUNWU_USER_ID=${{ vars.YUNWU_USER_ID || '' }}
      forward_all_secrets: false
      index_html_path: static/docs.html
      extra_paths: |
        /app.js
        /docs
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
    secrets: inherit

  verify-deployment:
    needs: deploy
    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      (
        github.ref == 'refs/heads/development' ||
        (
          github.ref != 'refs/heads/development' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_preview == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify stable deployment identity and health
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          TARGET_PROJECT: ${{ github.ref == 'refs/heads/development' && 'ai-ubq-fi' || 'p-ai-ubq-fi' }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" = "refs/heads/development" ]; then
            [ "$TARGET_PROJECT" = "ai-ubq-fi" ] || {
              echo "::error::Development verification must target ai-ubq-fi."
              exit 1
            }
          else
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || {
              echo "::error::Preview verification requires workflow_dispatch."
              exit 1
            }
            [ "$TARGET_PROJECT" = "p-ai-ubq-fi" ] || {
              echo "::error::Preview verification must target p-ai-ubq-fi."
              exit 1
            }
          fi
          [ -n "$DENO_DEPLOY_TOKEN" ] || {
            echo "::error::DENO_DEPLOY_TOKEN is required for deployment verification."
            exit 1
          }
          echo "::add-mask::$DENO_DEPLOY_TOKEN"

          stable_url="https://${TARGET_PROJECT}.ubiquity-dao.deno.net"
          revision_id=""
          revision_url=""
          deployment_id=""
          last_status="000"
          last_git_sha=""
          last_deployment_id=""
          for _attempt in $(seq 1 18); do
            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "$headers" "$body"' EXIT
            http_code="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "${stable_url}/health" || true)"
            git_sha="$(awk 'tolower($1) == "x-uos-git-sha:" { gsub("\r", "", $2); print $2; exit }' "$headers")"
            reported_deployment_id="$(awk 'tolower($1) == "x-uos-deployment-id:" { gsub("\r", "", $2); print $2; exit }' "$headers")"
            last_status="$http_code"
            last_git_sha="$git_sha"
            last_deployment_id="$reported_deployment_id"

            attestable_health=false
            if [ "$http_code" = "200" ] && jq -e \
              --arg git_sha "$git_sha" \
              --arg deployment_id "$reported_deployment_id" '
              .status == "available" and
              .release.git_sha == $git_sha and
              .release.deployment_id == $deployment_id
            ' "$body" >/dev/null 2>&1; then
              attestable_health=true
            elif [ "$http_code" = "503" ] && jq -e '
              .ok == false and
              .status == 503 and
              .upstream == "chatgpt_codex" and
              .details == "Codex upstream models endpoint returned 429."
            ' "$body" >/dev/null 2>&1; then
              # An exhausted Codex account is an accepted preview/production
              # state: the request path must observe this authoritative 429
              # before it can exercise Yunwu fallback. Keep every deployment
              # identity check below mandatory.
              attestable_health=true
            fi
            if [ "$attestable_health" = "true" ] && [ "$git_sha" = "$GITHUB_SHA" ] && [ -n "$reported_deployment_id" ] && [ "$reported_deployment_id" != "unknown" ]; then
              # DENO_DEPLOY_BUILD_ID is emitted by stable health as the
              # serving build ID. Health proves stable routing; this confirms
              # that build has a valid Deno Deploy terminal state.
              deployments_json="$(deno deploy deployments list --json --non-interactive --org ubiquity-dao --app "$TARGET_PROJECT" --limit 50 --token "$DENO_DEPLOY_TOKEN" 2>/dev/null || true)"
              if printf '%s' "$deployments_json" | jq -e --arg id "$reported_deployment_id" \
                '.items[] | select(.id == $id and (.status == "routed" or .status == "succeeded"))' \
                >/dev/null 2>&1; then
                revision_id="$reported_deployment_id"
                deployment_id="$reported_deployment_id"
                revision_url="https://console.deno.com/ubiquity-dao/${TARGET_PROJECT}/builds/${revision_id}"
                rm -f "$headers" "$body"
                break
              fi
            fi
            rm -f "$headers" "$body"
            sleep 10
          done

          if [ -z "$revision_id" ]; then
            echo "::error::Stable deployment identity/health check failed for ${stable_url}/health (HTTP ${last_status}, git ${last_git_sha:-<missing>}, deployment ${last_deployment_id:-<missing>}, expected ${GITHUB_SHA})."
            exit 1
          fi
          {
            echo "### Deployment attestation"
            echo ""
            echo "- Target: \`${TARGET_PROJECT}\`"
            echo "- Stable URL: ${stable_url}"
            echo "- Revision URL: ${revision_url}"
            echo "- Revision ID: \`${revision_id}\`"
            echo "- Deployment ID: \`${deployment_id}\`"
            echo "- Git SHA: \`${GITHUB_SHA}\`"
            echo "- Health: HTTP ${last_status}; release identity attested"
          } >> "$GITHUB_STEP_SUMMARY"
