name: Deno Deploy

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@codex/deno-2-programmatic
    with:
      project: ai-ubq-fi
      deploy_platform: deno2
      entrypoint: serve.ts
      install_command: deno install
      build_command: deno task build
      runtime_env: |
        DENO_DEPLOY_TOKEN=$DENO_DEPLOY_TOKEN
        UOS_AI_TOKEN=$UBIQUITY_AI_USER_TOKEN
      index_html_path: static/docs.html
      extra_paths: |
        /app.js
        /docs
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
        CODEX_AUTH_JSON_B64
    secrets: inherit

  upload-codex-auth:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Codex CLI
        shell: bash
        run: npm install --global --no-audit --no-fund @openai/codex@latest

      - name: Resolve Deno app URL
        id: deploy-target
        shell: bash
        env:
          PROJECT: ai-ubq-fi
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          DENO_DEPLOY_ORG: ubiquity-dao
        run: |
          set -euo pipefail

          target="$PROJECT"
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base="${PROJECT%-ubq-fi}"
            if [ ${#base} -gt 17 ]; then
              hash="$(printf '%s' "$base" | sha1sum | cut -c1-4)"
              base="${base:0:12}-${hash}"
            fi
            target="p-${base}-ubq-fi"
          fi

          echo "app=$target" >> "$GITHUB_OUTPUT"
          echo "url=https://${target}.${DENO_DEPLOY_ORG}.deno.net" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy-target.outputs.url }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            http_code="$(curl -sS -L -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || echo "000")"
            if [ "$http_code" = "200" ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "::error::Deployment did not become reachable at $DEPLOY_URL"
          exit 1

      - name: Ensure Deno KV database
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ubiquity-dao
          DENO_DEPLOY_APP: ${{ steps.deploy-target.outputs.app }}
        run: |
          set -euo pipefail

          database="${DENO_DEPLOY_APP}-kv"

          set +e
          output="$(deno deploy database provision "$database" --kind denokv --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" 2>&1)"
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "$output"
          elif printf '%s\n' "$output" | grep -Eqi "already|exists"; then
            echo "$output"
          elif printf '%s\n' "$output" | grep -qi "database instance limit"; then
            echo "$output"
            list_output="$(deno deploy database list --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" 2>&1)"
            database="$(
              LIST_OUTPUT="$list_output" python - <<'PY'
          import os
          import re

          text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", os.environ.get("LIST_OUTPUT", ""))
          for line in text.splitlines():
              stripped = line.strip()
              if not stripped:
                  continue
              if "│" in stripped:
                  parts = [part.strip() for part in stripped.strip("│").split("│")]
                  candidate = parts[0] if parts else ""
              else:
                  match = re.match(r"^([a-z0-9][a-z0-9-]*)\s+", stripped)
                  candidate = match.group(1) if match else ""
              if candidate and candidate.lower() not in {"name", "slug", "database"}:
                  print(candidate)
                  break
          PY
            )"
            if [ -z "$database" ]; then
              echo "::error::Could not find an existing Deno KV database to assign."
              printf '%s\n' "$list_output"
              exit 1
            fi
            echo "Using existing Deno KV database '$database'."
          else
            echo "$output"
            exit $status
          fi

          set +e
          output="$(deno deploy database assign "$database" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1)"
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "$output"
          elif printf '%s\n' "$output" | grep -Eqi "already|assigned"; then
            echo "$output"
          else
            echo "$output"
            exit $status
          fi

      - name: Sync AI runtime env
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ubiquity-dao
          DENO_DEPLOY_APP: ${{ steps.deploy-target.outputs.app }}
          UOS_AI_KERNEL_PUBLIC_KEY: ${{ secrets.UOS_AI_KERNEL_PUBLIC_KEY || secrets.UBIQUITY_AI_KERNEL_PUBLIC_KEY || vars.UOS_AI_KERNEL_PUBLIC_KEY || vars.UBIQUITY_AI_KERNEL_PUBLIC_KEY || '' }}
          VOYAGEAI_API_KEY: ${{ secrets.VOYAGEAI_API_KEY || vars.VOYAGEAI_API_KEY || '' }}
        run: |
          set -euo pipefail

          sync_secret() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "$value" ]; then
              return 0
            fi

            while IFS= read -r mask_line; do
              [ -n "$mask_line" ] && echo "::add-mask::$mask_line"
            done <<< "$value"
            local cli_value="$value"
            case "$cli_value" in
              -*) cli_value=" $cli_value" ;;
            esac

            set +e
            output="$(deno deploy env update-value "$key" "$cli_value" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1)"
            status=$?
            set -e
            if [ $status -eq 0 ]; then
              echo "$output"
              return 0
            fi

            if printf '%s\n' "$output" | grep -qi "not found"; then
              deno deploy env add "$key" "$cli_value" --secret --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP"
              return 0
            fi

            echo "$output"
            return $status
          }

          sync_secret UOS_AI_KERNEL_PUBLIC_KEY
          sync_secret VOYAGEAI_API_KEY

      - name: Upload Codex auth to KV
        shell: bash
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 || vars.CODEX_AUTH_JSON_B64 || '' }}
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy-target.outputs.url }}
        run: |
          set -euo pipefail

          if [ -z "$CODEX_AUTH_JSON_B64" ]; then
            echo "::error::CODEX_AUTH_JSON_B64 is required to bootstrap Codex auth in KV."
            exit 1
          fi

          auth_json_file="$RUNNER_TEMP/codex-auth.json"
          codex_bin="$(command -v codex)"
          printf '%s' "$CODEX_AUTH_JSON_B64" | base64 --decode > "$auth_json_file"

          deno run --env --allow-env --allow-net --allow-read scripts/upload-codex-auth.ts \
            --url "$DEPLOY_URL" \
            --auth-json "$auth_json_file" \
            --codex-bin "$codex_bin" \
            --admin-token "$DENO_DEPLOY_TOKEN"
