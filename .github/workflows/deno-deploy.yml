name: Deno Deploy

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@main
    with:
      project: ai-ubq-fi
      entrypoint: serve.ts
      env_var_keys: |
        OPENAI_API_KEY
        UBQ_AI_AUTH_TOKENS
      extra_paths: |
        /health
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
        OPENAI_API_KEY
        UBQ_AI_AUTH_TOKENS
    secrets: inherit

