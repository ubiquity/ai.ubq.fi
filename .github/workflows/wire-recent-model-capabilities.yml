name: Wire Recent Model Capabilities

on:
  push:
    branches:
      - feature/recent-model-reasoning-levels

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message || '', '[capability wiring]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.5
      - name: Wire generated capability data into API responses
        run: deno run --allow-read=src/openai.ts --allow-write=src/openai.ts scripts/wire-recent-model-capabilities.ts
      - name: Remove one-shot wiring files
        run: rm -f scripts/wire-recent-model-capabilities.ts .github/workflows/wire-recent-model-capabilities.yml
      - name: Format and validate
        run: |
          deno fmt src/openai.ts src/recent_model_capabilities.ts tests/recent-model-capabilities-server.test.ts tests/recent-model-contexts.test.ts static/models.js static/reasoning-select.js
          deno lint src/openai.ts src/recent_model_capabilities.ts tests/recent-model-capabilities-server.test.ts tests/recent-model-contexts.test.ts scripts/snapshot-recent-model-contexts.ts
          deno check --frozen serve.ts
          deno test --frozen --env --allow-net=127.0.0.1 --allow-env=CEREBRAS_API_KEY,VOYAGEAI_API_KEY,METERED_API_KEY,SURPLUS_API_KEY,IMAGE_BASE_MODEL,GIT_REVISION,GITHUB_SHA,DENO_DEPLOYMENT_ID,DENO_DEPLOY_BUILD_ID tests/recent-model-capabilities-server.test.ts tests/recent-model-contexts.test.ts tests/reasoning-select.test.ts
      - name: Commit backend wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(models): publish context and compaction capabilities [capability wiring]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
