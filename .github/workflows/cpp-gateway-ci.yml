name: C++ gateway CI
run-name: C++ gateway CI ${{ github.sha }}

# The full gateway suite and the registered library robustness harnesses run on ARM64.
on:
  push:
    branches: [claude/cpp-gateway-port, "pool-merge/**", "agent-jobs/**"]
  pull_request:
    branches: [claude/cpp-gateway-port]
  workflow_dispatch:

concurrency:
  group: cpp-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format changed files
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed files
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=$BASE
          if [[ -z $base || $base =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^)
          elif ! git cat-file -e "$base^{commit}"; then
            git fetch --no-tags origin "$base"
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$base" HEAD)
          fi
          git diff --check "$base" HEAD
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.ts|*.tsx|*.mjs|*.cjs|*.js|*.jsx|*.json|*.jsonc|*.md|*.css|*.html|*.yml|*.yaml)
                printf '%s\0' "$file" >> "$RUNNER_TEMP/format-paths" ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          if [[ -s "$RUNNER_TEMP/format-paths" ]]; then
            echo 'format=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.select.outputs.format == 'true'
        with:
          bun-version: 1.4.0
      - name: Check formatting with the frozen tool
        if: steps.select.outputs.format == 'true'
        run: |
          test -f bun.lock
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          mapfile -d '' -t files < "$RUNNER_TEMP/format-paths"
          bun --no-env-file --no-install run format:check -- "${files[@]}"

  suite:
    name: ${{ matrix.config }} suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        config: [release, asan]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm ninja-build pkg-config mold util-linux libboost-json-dev \
            libboost-container-dev libssl-dev zlib1g-dev libicu-dev libbrotli-dev libzstd-dev
          clang++ --version
      - name: Build SQLite 3.54.0 (the suite's pinned version)
        run: |
          mkdir -p "$RUNNER_TEMP/sqlite" && cd "$RUNNER_TEMP/sqlite"
          curl --fail --silent --show-error --location https://www.sqlite.org/2026/sqlite-autoconf-3540000.tar.gz -o sqlite.tar.gz
          echo "134ec0802dda5795816e25d25872d20b312cb3973438c49b30bc40b7705ea9ed  sqlite.tar.gz" | sha256sum --check
          tar -xzf sqlite.tar.gz && cd sqlite-autoconf-3540000
          ./configure --prefix=/usr/local --disable-static --disable-readline CFLAGS='-O2 -DSQLITE_DQS=3' > /dev/null
          make -j4 > /dev/null && sudo make install > /dev/null && sudo ldconfig
      - name: Build and test
        env:
          CC: clang
          CXX: clang++
          UOS_CI_JOBS: 4
          UOS_CI_BUILD_DIR: ${{ runner.temp }}/uos-gateway-build
          UOS_CI_SQLITE_PREFIX: /usr/local
          CONFIG: ${{ matrix.config }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$UOS_CI_BUILD_DIR"
          bash cpp/gateway/tools/ci-build.sh --config "$CONFIG" --shard "$SHARD/4" 2>&1 | tee "$UOS_CI_BUILD_DIR/driver.log"
      - name: Summarize results
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CONFIG: ${{ matrix.config }}
          UOS_CI_BUILD_DIR: ${{ runner.temp }}/uos-gateway-build
        run: |
          mkdir -p "$UOS_CI_BUILD_DIR"
          summary="$UOS_CI_BUILD_DIR/summary.md"
          if [[ "$CHECKOUT_OUTCOME" == success ]]; then
            python3 -B cpp/gateway/cmake/ci/summary.py "$UOS_CI_BUILD_DIR" --config "$CONFIG" > "$summary"
          else
            printf '### C++ gateway %s suite\n\nCheckout failed. See the checkout step log.\n' "$CONFIG" > "$summary"
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.config }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/uos-gateway-build/*/${{ matrix.config }}/receipt.json
            ${{ runner.temp }}/uos-gateway-build/*/${{ matrix.config }}/results.tsv
            ${{ runner.temp }}/uos-gateway-build/**/*.log
            ${{ runner.temp }}/uos-gateway-build/summary.md
          if-no-files-found: warn
          retention-days: 14

  targets:
    name: Discover robustness targets
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read target registry
        id: list
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-targets"
          matrix="$RUNNER_TEMP/fuzz-targets/matrix.json"
          python3 -B - "$matrix" <<'PY'
          import json
          from pathlib import Path
          import sys

          targets = json.loads(Path("cpp/gateway/fuzz/targets.json").read_text())["targets"]
          if not isinstance(targets, dict) or not targets:
              sys.exit("The robustness registry must contain at least one target.")
          Path(sys.argv[1]).write_text(json.dumps(sorted(targets)) + "\n")
          PY
          printf 'matrix=%s\n' "$(cat "$matrix")" >> "$GITHUB_OUTPUT"
      - name: Summarize target selection
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-targets"
          {
            printf '### C++ gateway robustness targets\n\n'
            if [[ -f "$RUNNER_TEMP/fuzz-targets/matrix.json" ]]; then
              printf '%s\n' '~~~json'
              cat "$RUNNER_TEMP/fuzz-targets/matrix.json"
              printf '%s\n' '~~~'
            else
              printf 'Target discovery failed. See the checkout or registry step log.\n'
            fi
          } | tee "$RUNNER_TEMP/fuzz-targets/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload target selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-targets
          path: ${{ runner.temp }}/fuzz-targets
          if-no-files-found: warn
          retention-days: 14

  fuzz:
    name: robustness (${{ matrix.target }})
    needs: targets
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm util-linux libboost-json-dev libboost-container-dev libbrotli-dev \
            libssl-dev libsqlite3-dev zlib1g-dev libzstd-dev libicu-dev
          clang++ --version
      - name: Build and fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/cpp-gateway-port' && '2400' || '300' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          fuzz_out="$RUNNER_TEMP/fuzz"
          mkdir -p "$fuzz_out/home" "$fuzz_out/tmp"
          sudo -n unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs \
            env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 HOME="$fuzz_out/home" TMPDIR="$fuzz_out/tmp" \
            python3 -B cpp/gateway/fuzz/ci.py "$FUZZ_TARGET" --seconds "$FUZZ_SECONDS" --jobs 4 --out "$fuzz_out" \
            2>&1 | tee "$fuzz_out/build.log"
      - name: Summarize campaign
        if: always()
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz"
          {
            printf '### C++ gateway robustness (%s)\n\n' "$FUZZ_TARGET"
            if [[ -f "$RUNNER_TEMP/fuzz/summary.json" ]]; then
              printf '%s\n' '~~~json'
              cat "$RUNNER_TEMP/fuzz/summary.json"
              printf '%s\n' '~~~'
            else
              printf 'The runner produced no campaign receipt. See the step logs and any uploaded diagnostics.\n'
            fi
          } | tee "$RUNNER_TEMP/fuzz/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload campaign results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/fuzz/artifacts
            ${{ runner.temp }}/fuzz/build.log
            ${{ runner.temp }}/fuzz/campaign.log
            ${{ runner.temp }}/fuzz/summary.json
            ${{ runner.temp }}/fuzz/summary.md
          if-no-files-found: warn
          retention-days: 14
