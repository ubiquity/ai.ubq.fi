name: Apply Context Window Metadata

on:
  push:
    branches:
      - feature/recent-model-context-windows

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/recent-model-context-windows
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.5
      - name: Apply integration patch
        run: deno run --allow-read --allow-write scripts/apply-recent-context-metadata.ts
      - name: Format
        run: deno fmt
      - name: Lint
        run: deno lint
      - name: Build
        run: deno task build
      - name: Test
        run: deno task test
      - name: Commit integrated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(models): add context windows and compaction thresholds'
          git push origin HEAD:feature/recent-model-context-windows
