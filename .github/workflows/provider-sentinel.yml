name: Provider Sentinel

on:
  workflow_dispatch:
    inputs:
      sentinel_mode:
        description: Run an hourly backlog cycle, supervised preview, or App-authenticated production incident
        required: true
        type: choice
        default: hourly
        options:
          - hourly
          - preview
          - incident

concurrency:
  group: provider-sentinel-diagnostic-${{ github.repository }}

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/codex/stability-handoff-2026-09-05-g552d65b8d4' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout pinned diagnostic SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0d7968ccb0d20af2c4f4df8e19dd1295408a06b6
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.9.5"

      - name: Download encrypted cell evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sentinel-matrix-cell-v1-33970468502-1-cell-71f09106da161236bb4b39a84d6741d30d0b225531a1eba2bbd97dd04036a304
          path: ${{ runner.temp }}/sentinel-cell-diagnostic
          run-id: 33970468502
          github-token: ${{ github.token }}

      - name: Emit allowlisted diagnostic metadata
        env:
          SENTINEL_ARTIFACT_KEY: ${{ secrets.SENTINEL_ARTIFACT_KEY }}
        run: |
          deno eval '
          import { decodeSentinelArtifactKey, decryptSentinelArtifact } from "./scripts/sentinel/artifact-crypto.ts";

          const CELL_REPORT_PATH =
            "reports/matrix/cell-71f09106da161236bb4b39a84d6741d30d0b225531a1eba2bbd97dd04036a304/cell.json";
          const EXPECTED_RUN_ID = "33970468502";
          const EXPECTED_BASE_SHA = "0d7968ccb0d20af2c4f4df8e19dd1295408a06b6";
          const REASON_CATEGORIES = [
            "Focused cell validation failed",
            "Cell replay detected a regression",
            "The cell agent did not return a final structured message",
            "The cell agent returned invalid JSON",
            "The cell agent violated the implementation output contract",
            "The cell agent did not cover exactly every finding",
            "The cell agent did not attribute every changed path to a finding",
            "Cell validation evidence was incomplete",
            "Codex invocation stopped (invalid_options).",
            "Codex invocation stopped (last_message_missing).",
            "Codex invocation stopped (output_limit_exceeded).",
            "Codex invocation stopped (native_review_missing).",
          ];
          const VALID_CHECK_NAME = /^[a-z][a-z0-9:-]{0,79}$/;

          const evidencePath =
            "${{ runner.temp }}/sentinel-cell-diagnostic/sentinel-evidence-v1.json";

          let keyBytes = new Uint8Array(0);
          let decryptedFiles: Array<{ path: string; bytes: Uint8Array<ArrayBuffer> }> = [];
          let plainBytes = new Uint8Array(0);
          let reportText = "";
          try {
            const rawKey = Deno.env.get("SENTINEL_ARTIFACT_KEY") ?? "";
            if (rawKey === "") throw new Error("Diagnostic artifact key missing");
            keyBytes = decodeSentinelArtifactKey(rawKey);
            const encrypted = await Deno.readFile(evidencePath);
            try {
              decryptedFiles = await decryptSentinelArtifact(encrypted, keyBytes);
            } finally {
              encrypted.fill(0);
            }
            const reportFile = decryptedFiles.find((file) => file.path === CELL_REPORT_PATH);
            if (reportFile === undefined) throw new Error("Diagnostic cell report missing");
            plainBytes = reportFile.bytes;
            reportText = new TextDecoder().decode(plainBytes);
            const report = JSON.parse(reportText);
            if (report.run_id !== EXPECTED_RUN_ID) throw new Error("Diagnostic run identity mismatch");
            if (report.base_sha !== EXPECTED_BASE_SHA) throw new Error("Diagnostic base identity mismatch");
            if (report.status !== "failed") throw new Error("Diagnostic cell status mismatch");
            if (!Array.isArray(report.changed_paths)) throw new Error("Diagnostic report shape mismatch");

            const boundedVerbatim = (value: string): string =>
              value.replaceAll(rawKey, "[REDACTED]").slice(0, 4096);
            const failureReason = typeof report.failure_reason === "string" ? report.failure_reason : null;
            let reasonIndex = null;
            let reasonOutput = "noncanonical_reason";
            if (failureReason !== null) {
              const matched = REASON_CATEGORIES.indexOf(failureReason);
              if (matched !== -1) {
                reasonIndex = matched;
                reasonOutput = failureReason;
              }
            }

            const validationChecks = [];
            for (const check of report.validation.checks ?? []) {
              if (
                typeof check.name !== "string" || typeof check.passed !== "boolean" ||
                typeof check.detail !== "string"
              ) continue;
              let detailCategory = "unclassified_detail";
              if (REASON_CATEGORIES.includes(check.detail)) detailCategory = check.detail;
              else if (check.detail === "Candidate validation failed") detailCategory = "Candidate validation failed";
              validationChecks.push({
                name: VALID_CHECK_NAME.test(check.name) ? check.name : "unknown_check",
                passed: check.passed,
                detail_category: detailCategory,
                detail_text: boundedVerbatim(check.detail),
              });
            }

            const fixedOutput: Record<string, unknown> = {
              failure_reason_index: reasonIndex,
              failure_reason: reasonOutput,
              failure_reason_detail: failureReason === null ? null : boundedVerbatim(failureReason),
              changed_path_count: report.changed_paths.length,
              validation_checks: validationChecks,
            };
            if (typeof report.validation.passed === "boolean") fixedOutput.validation_passed = report.validation.passed;
            if (typeof report.replay.passed === "boolean") fixedOutput.replay_passed = report.replay.passed;
            console.log(JSON.stringify(fixedOutput));
          } finally {
            keyBytes.fill(0);
            for (const file of decryptedFiles) file.bytes.fill(0);
            plainBytes.fill(0);
            reportText = "";
          }
          '
