name: Provider Sentinel
run-name: Provider Sentinel ${{ github.event_name }} ${{ github.run_id }}

on:
  schedule:
    # Hourly encrypted evidence archival and one eligible backlog repair. Incidents trigger separately.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      sentinel_mode:
        description: Run an hourly backlog cycle, supervised preview, or App-authenticated production incident
        required: true
        type: choice
        default: hourly
        options:
          - hourly
          - preview
          - incident
      incident_id:
        description: Opaque durable incident identifier
        required: false
        type: string
        default: ""
      incident_attempt:
        description: Durable incident delivery attempt
        required: false
        type: string
        default: ""
      incident_start_ms:
        description: First failed-request timestamp in milliseconds
        required: false
        type: string
        default: ""
      incident_ack_nonce:
        description: Opaque acknowledgement nonce for this delivery attempt
        required: false
        type: string
        default: ""

concurrency:
  # One repair cycle may operate on the repository or shared preview app at a time.
  group: provider-sentinel-${{ github.repository }}
  cancel-in-progress: false
  # Retain incident signals that arrive while a repair or deployment is active.
  queue: max

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  sentinel:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/development' &&
        (
          inputs.sentinel_mode == 'preview' ||
          (
            inputs.sentinel_mode == 'hourly' &&
            vars.SENTINEL_AUTONOMY_ENABLED == 'true'
          ) ||
          (
            inputs.sentinel_mode == 'incident' &&
            github.actor_id == '319834869' &&
            github.run_attempt == 1 &&
            vars.SENTINEL_AUTONOMY_ENABLED == 'true'
          )
        )
      ) ||
      (
        github.event_name == 'schedule' &&
        vars.SENTINEL_AUTONOMY_ENABLED == 'true'
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Require ciphertext-only artifact policy
        shell: bash
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          SENTINEL_ARTIFACT_KEY: ${{ secrets.SENTINEL_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          echo "SENTINEL_ARTIFACT_POLICY_ACTIVE=false" >> "$GITHUB_ENV"
          case "$REPOSITORY_VISIBILITY" in
            public|private|internal) ;;
            *)
              echo "::error::Provider Sentinel received an unsupported repository visibility."
              exit 1
              ;;
          esac
          if [ -z "$SENTINEL_ARTIFACT_KEY" ]; then
            echo "::error::SENTINEL_ARTIFACT_KEY is required before log capture."
            exit 1
          fi
          decoded_bytes="$(printf '%s' "$SENTINEL_ARTIFACT_KEY" | base64 --decode | wc -c | tr -d ' ')"
          if [ "$decoded_bytes" != "32" ]; then
            echo "::error::SENTINEL_ARTIFACT_KEY must encode exactly 32 bytes."
            exit 1
          fi
          echo "SENTINEL_ARTIFACT_POLICY_ACTIVE=true" >> "$GITHUB_ENV"
          echo "Ciphertext-only evidence policy active for $REPOSITORY_VISIBILITY visibility." >> "$GITHUB_STEP_SUMMARY"

      - name: Select immutable run mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.sentinel_mode }}
          REQUESTED_INCIDENT_ID: ${{ inputs.incident_id }}
          REQUESTED_INCIDENT_ATTEMPT: ${{ inputs.incident_attempt }}
          REQUESTED_INCIDENT_START_MS: ${{ inputs.incident_start_ms }}
          REQUESTED_INCIDENT_ACK_NONCE: ${{ inputs.incident_ack_nonce }}
          EXPECTED_SENTINEL_ACTOR_ID: "319834869"
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              case "$REQUESTED_MODE" in
                preview|hourly)
                  mode="$REQUESTED_MODE"
                  ;;
                incident)
                  if [ "$EVENT_ACTOR_ID" != "$EXPECTED_SENTINEL_ACTOR_ID" ]; then
                    echo "::error::Incident dispatch did not come from the Ubiquity Sentinel GitHub App."
                    exit 1
                  fi
                  if [ "$EVENT_RUN_ATTEMPT" != "1" ]; then
                    echo "::error::Incident workflow re-runs are forbidden."
                    exit 1
                  fi
                  if ! [[ "$REQUESTED_INCIDENT_ID" =~ ^provider-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
                    echo "::error::Incident ID is invalid."
                    exit 1
                  fi
                  if ! [[ "$REQUESTED_INCIDENT_ATTEMPT" =~ ^[1-3]$ ]]; then
                    echo "::error::Incident attempt is invalid."
                    exit 1
                  fi
                  if ! [[ "$REQUESTED_INCIDENT_START_MS" =~ ^[1-9][0-9]{12}$ ]]; then
                    echo "::error::Incident start is invalid."
                    exit 1
                  fi
                  if ! [[ "$REQUESTED_INCIDENT_ACK_NONCE" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
                    echo "::error::Incident acknowledgement nonce is invalid."
                    exit 1
                  fi
                  mode=incident
                  echo "SENTINEL_INCIDENT_ID=$REQUESTED_INCIDENT_ID" >> "$GITHUB_ENV"
                  echo "SENTINEL_INCIDENT_ATTEMPT=$REQUESTED_INCIDENT_ATTEMPT" >> "$GITHUB_ENV"
                  echo "SENTINEL_INCIDENT_START_MS=$REQUESTED_INCIDENT_START_MS" >> "$GITHUB_ENV"
                  echo "SENTINEL_INCIDENT_ACK_NONCE=$REQUESTED_INCIDENT_ACK_NONCE" >> "$GITHUB_ENV"
                  echo "SENTINEL_SIGNAL_ID=${REQUESTED_INCIDENT_ID}-a${REQUESTED_INCIDENT_ATTEMPT}" >> "$GITHUB_ENV"
                  ;;
                *)
                  echo "::error::Unsupported Provider Sentinel workflow mode."
                  exit 1
                  ;;
              esac
              ;;
            schedule)
              if [ "${{ github.event.schedule }}" = "0 * * * *" ]; then
                mode=hourly
              else
                echo "::error::Unsupported Provider Sentinel schedule."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported Provider Sentinel event."
              exit 1
              ;;
          esac
          echo "SENTINEL_MODE=$mode" >> "$GITHUB_ENV"
          echo "Sentinel mode: $mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Claim incident workflow run
        id: incident-claim
        if: github.event_name == 'workflow_dispatch' && inputs.sentinel_mode == 'incident'
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          SENTINEL_INCIDENT_ID: ${{ inputs.incident_id }}
          SENTINEL_INCIDENT_ATTEMPT: ${{ inputs.incident_attempt }}
          SENTINEL_INCIDENT_ACK_NONCE: ${{ inputs.incident_ack_nonce }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/sentinel-claim-response"
          request_body="$(
            jq -cn \
              --arg incident_id "$SENTINEL_INCIDENT_ID" \
              --arg attempt "$SENTINEL_INCIDENT_ATTEMPT" \
              --arg workflow_run_id "$GITHUB_RUN_ID" \
              --arg ack_nonce "$SENTINEL_INCIDENT_ACK_NONCE" \
              '{incident_id: $incident_id, attempt: ($attempt | tonumber), workflow_run_id: ($workflow_run_id | tonumber), ack_nonce: $ack_nonce}'
          )"
          status="$(
            curl \
              --silent \
              --show-error \
              --max-time 20 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$request_body" \
              https://ai-ubq-fi.ubiquity-dao.deno.net/admin/sentinel/incidents/claim
          )"
          if [ "$status" != "204" ]; then
            echo "::error::Incident workflow claim failed with HTTP $status."
            exit 1
          fi

      - name: Configure private Deno cache
        shell: bash
        run: |
          set -euo pipefail
          deno_dir="$RUNNER_TEMP/sentinel-deno-cache"
          mkdir -p "$deno_dir"
          chmod 700 "$deno_dir"
          echo "DENO_DIR=$deno_dir" >> "$GITHUB_ENV"
          echo "SENTINEL_CODEX_AUTH_STATE_DIR=$RUNNER_TEMP/sentinel-codex-auth-state" >> "$GITHUB_ENV"
          echo "SENTINEL_CODEX_AUTH_STATE_ENVELOPE=$RUNNER_TEMP/sentinel-codex-auth-envelope/sentinel-codex-auth-state-v1.json" >> "$GITHUB_ENV"

      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5

      - name: Restore or bootstrap encrypted Codex auth state
        id: auth-state-prepare
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_CODEX_AUTH_GENERATION: ${{ vars.SENTINEL_CODEX_AUTH_GENERATION }}
          SENTINEL_CODEX_AUTH_STATE_KEY: ${{ secrets.SENTINEL_CODEX_AUTH_STATE_KEY }}
          SENTINEL_CODEX_AUTH_SLOT_1_B64: ${{ secrets.SENTINEL_CODEX_AUTH_SLOT_1_B64 }}
          SENTINEL_CODEX_AUTH_SLOT_2_B64: ${{ secrets.SENTINEL_CODEX_AUTH_SLOT_2_B64 }}
        run: |
          set -euo pipefail
          deno run \
            --frozen \
            --lock=deno.lock \
            --allow-env \
            --allow-net \
            --allow-read="$RUNNER_TEMP" \
            --allow-write="$RUNNER_TEMP" \
            --allow-run=unzip \
            scripts/sentinel/auth-state.ts \
            prepare \
            "$SENTINEL_CODEX_AUTH_STATE_DIR"

      - name: Mask restored Codex auth state
        id: auth-state-mask-restored
        if: always() && steps.auth-state-prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          auth_files=("$SENTINEL_CODEX_AUTH_STATE_DIR"/slots/*/auth.json)
          if [ "${#auth_files[@]}" -lt 1 ]; then
            echo "::error::Restored Codex auth state contains no slots."
            exit 1
          fi
          for auth_file in "${auth_files[@]}"; do
            encoded="$(base64 --wrap=0 "$auth_file")"
            echo "::add-mask::$encoded"
            unset encoded
            while IFS= read -r secret_value; do
              if [ -n "$secret_value" ]; then
                echo "::add-mask::$secret_value"
              fi
            done < <(
              jq -er \
                '.tokens | [.id_token, .access_token, .refresh_token, .account_id] | .[] | select(type == "string" and length > 0)' \
                "$auth_file"
            )
          done

      - name: Install pinned Codex CLI for auth maintenance
        id: auth-maintenance-install
        if: >-
          always() &&
          steps.auth-state-prepare.outcome == 'success' &&
          steps.auth-state-prepare.outputs.needs_maintenance == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund @openai/codex@0.149.0
          test "$(codex --version)" = "codex-cli 0.149.0"
          codex_package_root="$(npm root --global)/@openai/codex"
          platform_package_json="$(node -e '
            const { createRequire } = require("node:module");
            const resolveFromCodex = createRequire(process.argv[1] + "/package.json");
            process.stdout.write(resolveFromCodex.resolve("@openai/codex-linux-x64/package.json"));
          ' "$codex_package_root")"
          native_codex="$(dirname "$platform_package_json")/vendor/x86_64-unknown-linux-musl/bin/codex"
          test -x "$native_codex"
          test "$("$native_codex" --version)" = "codex-cli 0.149.0"
          echo "SENTINEL_CODEX_AUTH_EXECUTABLE=$native_codex" >> "$GITHUB_ENV"

      - name: Let pinned Codex maintain its auth files
        id: auth-maintenance
        if: >-
          always() &&
          steps.auth-state-prepare.outcome == 'success' &&
          steps.auth-state-prepare.outputs.needs_maintenance == 'true' &&
          steps.auth-maintenance-install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          result_path="$RUNNER_TEMP/sentinel-codex-auth-maintenance-result.json"
          deno run \
            --frozen \
            --lock=deno.lock \
            --allow-env=PATH,RUNNER_TEMP,SENTINEL_CODEX_AUTH_EXECUTABLE,SENTINEL_CODEX_AUTH_STATE_DIR \
            --allow-read="$RUNNER_TEMP" \
            --allow-write="$RUNNER_TEMP" \
            --allow-run="$SENTINEL_CODEX_AUTH_EXECUTABLE" \
            scripts/sentinel/auth-maintenance.ts \
            maintain > "$result_path"
          jq -e '
            .schema_version == 1 and
            (.slots | type == "array" and length >= 1 and length <= 2) and
            ([.slots[].slot] | length == (unique | length)) and
            all(.slots[];
              (.slot == 1 or .slot == 2) and
              (.due | type) == "boolean" and
              (.invoked | type) == "boolean" and
              (.duplicateAccountSkipped | type) == "boolean" and
              (.rpcSucceeded | type) == "boolean" and
              (.managedAccountAvailable | type) == "boolean" and
              (
                .commandCode == null or
                (
                  (.commandCode | type) == "number" and
                  (.commandCode | floor) == .commandCode and
                  .commandCode >= 0 and
                  .commandCode <= 255
                )
              ) and
              (.timedOut | type) == "boolean" and
              (.outputExceeded | type) == "boolean" and
              (.stdoutBytes | type) == "number" and
              (.stdoutBytes | floor) == .stdoutBytes and
              .stdoutBytes >= 0 and
              (.stderrBytes | type) == "number" and
              (.stderrBytes | floor) == .stderrBytes and
              .stderrBytes >= 0 and
              (.stateChanged | type) == "boolean" and
              (.readyForMaintenanceWindow | type) == "boolean"
            )
          ' "$result_path" > /dev/null
          {
            echo "### Codex auth maintenance"
            echo
            jq -r '
              .slots | sort_by(.slot)[] |
              "- Slot \(.slot): due=\(.due); invoked=\(.invoked); " +
              "duplicate_account_skipped=\(.duplicateAccountSkipped); rpc_succeeded=\(.rpcSucceeded); " +
              "managed_account_available=\(.managedAccountAvailable); " +
              "command_code=\(.commandCode // "none"); timed_out=\(.timedOut); " +
              "output_exceeded=\(.outputExceeded); stdout_bytes=\(.stdoutBytes); " +
              "stderr_bytes=\(.stderrBytes); state_changed=\(.stateChanged); " +
              "ready_for_maintenance_window=\(.readyForMaintenanceWindow)"
            ' "$result_path"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Mask maintained Codex auth state
        id: auth-state-mask-maintained
        if: always() && steps.auth-state-prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          auth_files=("$SENTINEL_CODEX_AUTH_STATE_DIR"/slots/*/auth.json)
          if [ "${#auth_files[@]}" -lt 1 ]; then
            echo "::error::Maintained Codex auth state contains no slots."
            exit 1
          fi
          for auth_file in "${auth_files[@]}"; do
            encoded="$(base64 --wrap=0 "$auth_file")"
            echo "::add-mask::$encoded"
            unset encoded
            while IFS= read -r secret_value; do
              if [ -n "$secret_value" ]; then
                echo "::add-mask::$secret_value"
              fi
            done < <(
              jq -er \
                '.tokens | [.id_token, .access_token, .refresh_token, .account_id] | .[] | select(type == "string" and length > 0)' \
                "$auth_file"
            )
          done

      - name: Seal refreshed Codex auth state
        id: auth-state-seal
        if: always() && steps.auth-state-prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SENTINEL_CODEX_AUTH_GENERATION: ${{ vars.SENTINEL_CODEX_AUTH_GENERATION }}
          SENTINEL_CODEX_AUTH_STATE_KEY: ${{ secrets.SENTINEL_CODEX_AUTH_STATE_KEY }}
        run: |
          set -euo pipefail
          envelope_directory="$(dirname "$SENTINEL_CODEX_AUTH_STATE_ENVELOPE")"
          mkdir -p "$envelope_directory"
          chmod 700 "$envelope_directory"
          deno run \
            --frozen \
            --lock=deno.lock \
            --allow-env \
            --allow-read="$RUNNER_TEMP" \
            --allow-write="$RUNNER_TEMP" \
            scripts/sentinel/auth-state.ts \
            seal \
            "$SENTINEL_CODEX_AUTH_STATE_DIR" \
            "$SENTINEL_CODEX_AUTH_STATE_ENVELOPE"

      - name: Upload encrypted Codex auth state
        id: auth-state-upload
        if: always() && steps.auth-state-seal.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.auth-state-seal.outputs.artifact_name }}
          path: ${{ env.SENTINEL_CODEX_AUTH_STATE_ENVELOPE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Probe Codex auth readiness
        id: auth-state-readiness
        if: always() && steps.auth-state-upload.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          deno run \
            --frozen \
            --lock=deno.lock \
            --allow-env \
            --allow-net=chatgpt.com \
            --allow-read="$RUNNER_TEMP" \
            --allow-write="$RUNNER_TEMP" \
            scripts/sentinel/auth-state.ts \
            probe \
            "$SENTINEL_CODEX_AUTH_STATE_DIR"

      - name: Enforce durable Codex auth readiness
        id: auth-preflight
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.auth-state-prepare.outcome }}
          MASK_RESTORED_OUTCOME: ${{ steps.auth-state-mask-restored.outcome }}
          NEEDS_MAINTENANCE: ${{ steps.auth-state-prepare.outputs.needs_maintenance }}
          INSTALL_OUTCOME: ${{ steps.auth-maintenance-install.outcome }}
          MAINTENANCE_OUTCOME: ${{ steps.auth-maintenance.outcome }}
          MASK_MAINTAINED_OUTCOME: ${{ steps.auth-state-mask-maintained.outcome }}
          SEAL_OUTCOME: ${{ steps.auth-state-seal.outcome }}
          UPLOAD_OUTCOME: ${{ steps.auth-state-upload.outcome }}
          READINESS_OUTCOME: ${{ steps.auth-state-readiness.outcome }}
          AUTH_USABLE: ${{ steps.auth-state-readiness.outputs.auth_usable }}
          SELECTED_SLOT: ${{ steps.auth-state-readiness.outputs.selected_slot }}
          SLOT_1_CODE: ${{ steps.auth-state-readiness.outputs.slot_1_code }}
          SLOT_1_HTTP_STATUS: ${{ steps.auth-state-readiness.outputs.slot_1_http_status }}
          SLOT_1_HEADROOM_PERCENT: ${{ steps.auth-state-readiness.outputs.slot_1_headroom_percent }}
          SLOT_2_CODE: ${{ steps.auth-state-readiness.outputs.slot_2_code }}
          SLOT_2_HTTP_STATUS: ${{ steps.auth-state-readiness.outputs.slot_2_http_status }}
          SLOT_2_HEADROOM_PERCENT: ${{ steps.auth-state-readiness.outputs.slot_2_headroom_percent }}
        run: |
          set -euo pipefail
          safe_outcome() {
            case "$1" in
              success|failure|cancelled|skipped) printf '%s' "$1" ;;
              *) printf 'unavailable' ;;
            esac
          }
          safe_boolean() {
            case "$1" in
              true|false) printf '%s' "$1" ;;
              *) printf 'unavailable' ;;
            esac
          }
          safe_selected_slot() {
            case "$1" in
              1|2|none) printf '%s' "$1" ;;
              *) printf 'unavailable' ;;
            esac
          }
          safe_probe_code() {
            case "$1" in
              available|not_configured|invalid_base64|invalid_utf8|invalid_json|invalid_document|invalid_access_token|access_token_expiring|timeout|network_error|redirect_rejected|http_error|response_too_large|invalid_response_json|invalid_usage_document|quota_exhausted|ready|missing|account_identity_changed) printf '%s' "$1" ;;
              *) printf 'unavailable' ;;
            esac
          }
          safe_http_status() {
            if [ "$1" = "none" ] || [[ "$1" =~ ^[1-5][0-9][0-9]$ ]]; then
              printf '%s' "$1"
            else
              printf 'unavailable'
            fi
          }
          safe_headroom() {
            if [ "$1" = "none" ] || [[ "$1" =~ ^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$ ]]; then
              printf '%s' "$1"
            else
              printf 'unavailable'
            fi
          }

          auth_usable="$(safe_boolean "$AUTH_USABLE")"
          selected_slot="$(safe_selected_slot "$SELECTED_SLOT")"
          slot_1_code="$(safe_probe_code "$SLOT_1_CODE")"
          slot_1_http_status="$(safe_http_status "$SLOT_1_HTTP_STATUS")"
          slot_1_headroom_percent="$(safe_headroom "$SLOT_1_HEADROOM_PERCENT")"
          slot_2_code="$(safe_probe_code "$SLOT_2_CODE")"
          slot_2_http_status="$(safe_http_status "$SLOT_2_HTTP_STATUS")"
          slot_2_headroom_percent="$(safe_headroom "$SLOT_2_HEADROOM_PERCENT")"

          failed=false
          for outcome in \
            "$PREPARE_OUTCOME" \
            "$MASK_RESTORED_OUTCOME" \
            "$MASK_MAINTAINED_OUTCOME" \
            "$SEAL_OUTCOME" \
            "$UPLOAD_OUTCOME" \
            "$READINESS_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              failed=true
            fi
          done
          if [ "$NEEDS_MAINTENANCE" = "true" ]; then
            if [ "$INSTALL_OUTCOME" != "success" ] || [ "$MAINTENANCE_OUTCOME" != "success" ]; then
              failed=true
            fi
          elif [ "$NEEDS_MAINTENANCE" != "false" ]; then
            failed=true
          fi
          for diagnostic in \
            "$auth_usable" \
            "$selected_slot" \
            "$slot_1_code" \
            "$slot_1_http_status" \
            "$slot_1_headroom_percent" \
            "$slot_2_code" \
            "$slot_2_http_status" \
            "$slot_2_headroom_percent"; do
            if [ "$diagnostic" = "unavailable" ]; then
              failed=true
            fi
          done
          if [ "$READINESS_OUTCOME" = "success" ] && \
            { [ "$auth_usable" != "true" ] || [ "$selected_slot" = "none" ]; }; then
            failed=true
          fi
          {
            echo "### Codex auth durability preflight"
            echo
            echo "- Prepare: $(safe_outcome "$PREPARE_OUTCOME")"
            echo "- Mask restored state: $(safe_outcome "$MASK_RESTORED_OUTCOME")"
            echo "- Maintenance required: $(safe_boolean "$NEEDS_MAINTENANCE")"
            echo "- Maintenance install: $(safe_outcome "$INSTALL_OUTCOME")"
            echo "- Maintenance run: $(safe_outcome "$MAINTENANCE_OUTCOME")"
            echo "- Mask maintained state: $(safe_outcome "$MASK_MAINTAINED_OUTCOME")"
            echo "- Seal: $(safe_outcome "$SEAL_OUTCOME")"
            echo "- Upload: $(safe_outcome "$UPLOAD_OUTCOME")"
            echo "- Readiness probe: $(safe_outcome "$READINESS_OUTCOME")"
            echo "- Probe usable: $auth_usable"
            echo "- Probe selected slot: $selected_slot"
            echo "- Probe slot 1: code=$slot_1_code; HTTP status=$slot_1_http_status; headroom percent=$slot_1_headroom_percent"
            echo "- Probe slot 2: code=$slot_2_code; HTTP status=$slot_2_http_status; headroom percent=$slot_2_headroom_percent"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" = "true" ]; then
            echo "::error::Sentinel Codex auth durability failed: prepare=$(safe_outcome "$PREPARE_OUTCOME"), mask_restored=$(safe_outcome "$MASK_RESTORED_OUTCOME"), needs_maintenance=$(safe_boolean "$NEEDS_MAINTENANCE"), install=$(safe_outcome "$INSTALL_OUTCOME"), maintenance=$(safe_outcome "$MAINTENANCE_OUTCOME"), mask_maintained=$(safe_outcome "$MASK_MAINTAINED_OUTCOME"), seal=$(safe_outcome "$SEAL_OUTCOME"), upload=$(safe_outcome "$UPLOAD_OUTCOME"), readiness=$(safe_outcome "$READINESS_OUTCOME")."
            echo "::error::Sentinel Codex auth probe failed: usable=$auth_usable, selected_slot=$selected_slot, slot_1_code=$slot_1_code, slot_1_http_status=$slot_1_http_status, slot_1_headroom_percent=$slot_1_headroom_percent, slot_2_code=$slot_2_code, slot_2_http_status=$slot_2_http_status, slot_2_headroom_percent=$slot_2_headroom_percent."
            exit 1
          fi
          echo "Codex auth state was restored, durably sealed, and passively probed." >> "$GITHUB_STEP_SUMMARY"

      - name: Select agent work
        id: agent-work
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          needs_agent=true
          if [ "$SENTINEL_MODE" = "hourly" ]; then
            hint_path="$RUNNER_TEMP/sentinel-review-backlog.md"
            issue_ledger_path="$RUNNER_TEMP/sentinel-issue-jobs.md"
            hint_sha=""
            basic_token="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic_token"
            export GIT_TERMINAL_PROMPT=0
            hint_ready=false
            if git fetch --no-tags origin development; then
              candidate_hint_sha="$(git rev-parse origin/development)"
              backlog_blob_size="$(git cat-file -s origin/development:docs/sentinel-review-backlog.md 2>/dev/null || true)"
              issue_ledger_blob_size="$(git cat-file -s origin/development:docs/sentinel-issue-jobs.md 2>/dev/null || true)"
              if [[ "$candidate_hint_sha" =~ ^[0-9a-f]{40}$ ]] && \
                [[ "$backlog_blob_size" =~ ^[0-9]+$ ]] && \
                [[ "$issue_ledger_blob_size" =~ ^[0-9]+$ ]] && \
                [ "$backlog_blob_size" -le 262144 ] && \
                [ "$issue_ledger_blob_size" -le 262144 ] && \
                git show origin/development:docs/sentinel-review-backlog.md > "$hint_path" && \
                git show origin/development:docs/sentinel-issue-jobs.md > "$issue_ledger_path"
              then
                hint_sha="$candidate_hint_sha"
                hint_ready=true
              fi
            fi
            if [ "$hint_ready" = "true" ]; then
              if ! needs_agent="$(
                deno eval \
                  --no-remote \
                  --no-npm \
                  --frozen \
                  --lock=deno.lock \
                  '
                    import { GitHubActionsClient } from "./scripts/sentinel/github.ts";
                    import {
                      GITHUB_ISSUE_JOB_HINT_FILENAME,
                      renderGitHubIssueJobHint,
                      selectNextGitHubIssueJobSelection,
                    } from "./scripts/sentinel/issues.ts";
                    import { selectNextReviewBacklogEntry } from "./scripts/sentinel/review.ts";
                    const runnerTemp = Deno.env.get("RUNNER_TEMP");
                    const repository = Deno.env.get("GITHUB_REPOSITORY");
                    const token = Deno.env.get("GITHUB_TOKEN");
                    if (!runnerTemp || !repository || !token) throw new Error("Sentinel work-selector context is missing");
                    const backlog = await Deno.readTextFile(`${runnerTemp}/sentinel-review-backlog.md`);
                    if (selectNextReviewBacklogEntry(backlog) !== null) {
                      console.log("true");
                    } else {
                      const ledger = await Deno.readTextFile(`${runnerTemp}/sentinel-issue-jobs.md`);
                      const github = new GitHubActionsClient({ repository, token });
                      const issueSelection = await selectNextGitHubIssueJobSelection(github, repository, ledger);
                      await Deno.writeTextFile(
                        `${runnerTemp}/${GITHUB_ISSUE_JOB_HINT_FILENAME}`,
                        renderGitHubIssueJobHint(
                          issueSelection?.job ?? null,
                          issueSelection?.checkpoint ?? null,
                        ),
                        { createNew: true },
                      );
                      console.log(issueSelection === null ? "false" : "true");
                    }
                  '
              )"; then
                needs_agent=true
                echo "::warning::Sentinel backlog hint could not be parsed; installing agent prerequisites conservatively."
              fi
            else
              echo "::warning::Current development backlog could not be read; installing agent prerequisites conservatively."
            fi
            if [ -n "$hint_sha" ]; then
              echo "SENTINEL_BACKLOG_HINT_SHA=$hint_sha" >> "$GITHUB_ENV"
            fi
            unset basic_token GITHUB_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_TERMINAL_PROMPT
          fi
          case "$needs_agent" in
            true|false) ;;
            *)
              echo "::error::Sentinel agent work selector returned an invalid result."
              exit 1
              ;;
          esac
          echo "needs_agent=$needs_agent" >> "$GITHUB_OUTPUT"
          echo "Sentinel agent work required: $needs_agent" >> "$GITHUB_STEP_SUMMARY"

      - name: Install isolated-agent prerequisites
        if: steps.agent-work.outputs.needs_agent == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          npm install --global --ignore-scripts --no-audit --no-fund @openai/codex@0.149.0
          mkdir -p "$RUNNER_TEMP/sentinel-bin"
          GOBIN="$RUNNER_TEMP/sentinel-bin" go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$RUNNER_TEMP/sentinel-bin" >> "$GITHUB_PATH"
          bwrap --version
          codex --version
          "$RUNNER_TEMP/sentinel-bin/gitleaks" version

      - name: Prime locked Deno dependency cache
        shell: bash
        run: |
          set -euo pipefail
          deno cache \
            --frozen \
            --lock=deno.lock \
            serve.ts \
            scripts/setup-instance.ts \
            scripts/sentinel/main.ts \
            tests/*.ts

      - name: Validate pinned Codex CLI argument contract
        if: steps.agent-work.outputs.needs_agent == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deno test \
            --cached-only \
            --allow-env=PATH \
            --allow-run=codex \
            tests/sentinel-codex-cli-integration.test.ts

      - name: Install issue-delivery development-push gate
        shell: bash
        run: |
          set -euo pipefail
          real_git="$(command -v git)"
          wrapper_dir="$RUNNER_TEMP/sentinel-git-wrapper"
          mkdir -p "$wrapper_dir"
          {
            printf '#!/usr/bin/env bash\nset -euo pipefail\nREAL_GIT=%q\n' "$real_git"
            cat <<'EOF'
          if [ "${SENTINEL_GIT_WRAPPER_BYPASS:-}" = "1" ]; then
            exec "$REAL_GIT" "$@"
          fi
          is_push=false
          development_spec=""
          for argument in "$@"; do
            if [ "$argument" = "push" ]; then
              is_push=true
            fi
            case "$argument" in
              *:refs/heads/development) development_spec="$argument" ;;
            esac
          done
          if [ "$is_push" = "true" ] && [ -n "$development_spec" ]; then
            probe="$(pwd -P)"
            repository_root=""
            while [ "$probe" != "/" ]; do
              if [ -f "$probe/.sentinel/reports/cycle.json" ]; then
                repository_root="$probe"
                break
              fi
              probe="$(dirname "$probe")"
            done
            if [ -z "$repository_root" ]; then
              echo "Provider Sentinel development push has no cycle report root." >&2
              exit 1
            fi
            local_ref="${development_spec%%:*}"
            local_sha="$("$REAL_GIT" rev-parse "$local_ref")"
            remote_sha="$("$REAL_GIT" ls-remote --heads origin refs/heads/development | awk '{print $1}')"
            if ! [[ "$local_sha" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Provider Sentinel development push has invalid local or remote identity." >&2
              exit 1
            fi
            authorization="${GIT_CONFIG_VALUE_0:-}"
            case "$authorization" in
              "AUTHORIZATION: basic "*) ;;
              *)
                echo "Provider Sentinel development push is missing trusted GitHub authorization." >&2
                exit 1
                ;;
            esac
            basic="${authorization#AUTHORIZATION: basic }"
            decoded="$(printf '%s' "$basic" | base64 --decode)"
            case "$decoded" in
              x-access-token:*) token="${decoded#x-access-token:}" ;;
              *)
                echo "Provider Sentinel development push authorization is invalid." >&2
                exit 1
                ;;
            esac
            repository="${GITHUB_REPOSITORY:-}"
            if ! [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "Provider Sentinel repository identity is invalid." >&2
              exit 1
            fi
            run_id="$(jq -r '.run_id // empty' "$repository_root/.sentinel/reports/cycle.json")"
            if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Provider Sentinel cycle has no GitHub workflow run ID." >&2
              exit 1
            fi
            printf '%s %s refs/heads/development %s\n' "$local_ref" "$local_sha" "$remote_sha" | \
              SENTINEL_GIT_WRAPPER_BYPASS=1 \
              SENTINEL_REAL_GIT="$REAL_GIT" \
              GITHUB_WORKSPACE="$repository_root" \
              GITHUB_TOKEN="$token" \
              GITHUB_REPOSITORY="$repository" \
              GITHUB_RUN_ID="$run_id" \
              GITHUB_SERVER_URL="https://github.com" \
              deno run \
                --cached-only \
                --frozen \
                --lock="$repository_root/deno.lock" \
                --allow-env \
                --allow-net=api.github.com \
                --allow-read="$repository_root" \
                --allow-write="$repository_root/.sentinel/reports" \
                --allow-run="$REAL_GIT" \
                "$repository_root/scripts/sentinel/issue-pr-pre-push.ts"
          fi
          exec "$REAL_GIT" "$@"
          EOF
          } > "$wrapper_dir/git"
          chmod 700 "$wrapper_dir/git"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Run Provider Sentinel
        id: sentinel-run
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          PREVIEW_UOS_AI_USER_TOKEN: ${{ secrets.PREVIEW_UOS_AI_USER_TOKEN }}
          SENTINEL_REPLAY_KEY: ${{ secrets.SENTINEL_REPLAY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deno run \
            --cached-only \
            --frozen \
            --lock=deno.lock \
            --allow-env \
            --allow-net \
            --allow-read \
            --allow-write \
            --allow-run \
            scripts/sentinel/main.ts \
            --mode "$SENTINEL_MODE"

      - name: Classify incident infrastructure deferral
        id: incident-deferral-classification
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.sentinel_mode == 'incident' &&
          steps.incident-claim.outcome == 'success'
        shell: bash
        env:
          AUTH_PREFLIGHT_OUTCOME: ${{ steps.auth-preflight.outcome }}
          SENTINEL_RUN_OUTCOME: ${{ steps.sentinel-run.outcome }}
        run: |
          set -euo pipefail
          reason=""
          if [ "$SENTINEL_RUN_OUTCOME" = "skipped" ]; then
            if [ "$AUTH_PREFLIGHT_OUTCOME" = "failure" ]; then
              reason="codex_auth_preflight_failed"
            else
              reason="sentinel_infrastructure_preflight_failed"
            fi
          elif [ "$SENTINEL_RUN_OUTCOME" = "failure" ] && \
            [ -f .sentinel/reports/failure.json ] && \
            [ "$(jq -r '.codex_failure // empty' .sentinel/reports/failure.json)" = "auth_refresh_required" ]; then
            reason="codex_auth_preflight_failed"
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Reconcile GitHub issue delivery
        if: always() && env.SENTINEL_ARTIFACT_POLICY_ACTIVE == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_WORKFLOW_OUTCOME: ${{ steps.sentinel-run.outcome }}
        run: |
          set -euo pipefail
          deno run \
            --cached-only \
            --frozen \
            --lock=deno.lock \
            --allow-env=GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_SERVER_URL,SENTINEL_WORKFLOW_OUTCOME \
            --allow-net=api.github.com \
            --allow-read=.sentinel/reports \
            --allow-write=.sentinel/reports \
            scripts/sentinel/issue-delivery-reconcile.ts

      - name: Reject credential files from artifact paths
        if: always() && env.SENTINEL_ARTIFACT_POLICY_ACTIVE == 'true'
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          PREVIEW_UOS_AI_USER_TOKEN: ${{ secrets.PREVIEW_UOS_AI_USER_TOKEN }}
          SENTINEL_ARTIFACT_KEY: ${{ secrets.SENTINEL_ARTIFACT_KEY }}
          SENTINEL_CODEX_AUTH_STATE_KEY: ${{ secrets.SENTINEL_CODEX_AUTH_STATE_KEY }}
          SENTINEL_REPLAY_KEY: ${{ secrets.SENTINEL_REPLAY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "SENTINEL_PLAINTEXT_SAFE=false" >> "$GITHUB_ENV"
          if find \
            .sentinel/raw-logs \
            .sentinel/replay-cases \
            .sentinel/replay-index \
            .sentinel/reports \
            -type f \( -name auth.json -o -name '*codex-auth*' -o -name '*auth-slot*' \) \
            -print -quit 2>/dev/null | grep -q .; then
            echo "::error::A forbidden credential-like file exists in a Sentinel artifact path."
            exit 1
          fi
          for secret_name in \
            DENO_DEPLOY_TOKEN \
            PREVIEW_UOS_AI_USER_TOKEN \
            SENTINEL_ARTIFACT_KEY \
            SENTINEL_CODEX_AUTH_STATE_KEY \
            SENTINEL_REPLAY_KEY \
            GITHUB_TOKEN; do
            secret_value="${!secret_name:-}"
            if [ -n "$secret_value" ]; then
              pattern_file="$(mktemp "$RUNNER_TEMP/sentinel-artifact-pattern.XXXXXX")"
              chmod 600 "$pattern_file"
              printf '%s' "$secret_value" > "$pattern_file"
              if grep \
                --recursive \
                --fixed-strings \
                --quiet \
                --file "$pattern_file" \
                .sentinel/raw-logs \
                .sentinel/replay-cases \
                .sentinel/replay-index \
                .sentinel/reports 2>/dev/null; then
                : > "$pattern_file"
                rm -f "$pattern_file"
                echo "::error::Credential material exists in a Sentinel artifact path."
                exit 1
              fi
              : > "$pattern_file"
              rm -f "$pattern_file"
            fi
          done
          shopt -s nullglob
          for auth_file in "$SENTINEL_CODEX_AUTH_STATE_DIR"/slots/*/auth.json; do
            pattern_file="$(mktemp "$RUNNER_TEMP/sentinel-auth-state-pattern.XXXXXX")"
            chmod 600 "$pattern_file"
            {
              base64 --wrap=0 "$auth_file"
              echo
              jq -er \
                '.tokens | [.id_token, .access_token, .refresh_token, .account_id] | .[] | select(type == "string" and length > 0)' \
                "$auth_file"
            } > "$pattern_file"
            if grep \
              --recursive \
              --fixed-strings \
              --quiet \
              --file "$pattern_file" \
              .sentinel/raw-logs \
              .sentinel/replay-cases \
              .sentinel/replay-index \
              .sentinel/reports 2>/dev/null; then
              : > "$pattern_file"
              rm -f "$pattern_file"
              echo "::error::Codex auth material exists in a Sentinel artifact path."
              exit 1
            fi
            : > "$pattern_file"
            rm -f "$pattern_file"
          done
          echo "SENTINEL_PLAINTEXT_SAFE=true" >> "$GITHUB_ENV"

      - name: Remove plaintext Codex auth state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            "$RUNNER_TEMP/sentinel-codex-auth-state" \
            "$RUNNER_TEMP/sentinel-codex-auth-envelope" \
            "$RUNNER_TEMP/sentinel-codex-auth-maintenance-workspace"; do
            if [ -e "$target" ]; then
              find "$target" -type f -exec sh -c ': > "$1"' _ {} \;
              rm -rf -- "$target"
            fi
          done

      - name: Publish supervised cycle summary
        if: always() && env.SENTINEL_PLAINTEXT_SAFE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Provider Sentinel supervised cycle"
            echo
            echo "- Mode: ${SENTINEL_MODE:-unavailable}"
            if [ -f .sentinel/reports/cycle.json ]; then
              jq -r '
                "- Status: " + .status,
                "- Stage: " + .stage,
                "- Candidate SHA: " + (.candidate_sha // "not created"),
                "- Temporary branch: " + (.temporary_branch // "not created"),
                "- Branch disposition: " + (.branch_disposition // "unavailable")
              ' .sentinel/reports/cycle.json
            else
              echo "- Status: unavailable before initialization"
            fi
            if [ -f .sentinel/reports/triage.json ]; then
              jq -r '
                "- Findings: " + (.findings | length | tostring),
                "- Severity counts: P0=" + ([.findings[] | select(.severity == "P0")] | length | tostring) +
                  ", P1=" + ([.findings[] | select(.severity == "P1")] | length | tostring) +
                  ", P2=" + ([.findings[] | select(.severity == "P2")] | length | tostring) +
                  ", P3=" + ([.findings[] | select(.severity == "P3")] | length | tostring)
              ' .sentinel/reports/triage.json
            fi
            if [ -f .sentinel/reports/triage-gate.json ]; then
              selected_issue="$(jq -r '
                if .work_source != "github_issue" then empty
                elif (.github_issue_number | type) != "number" then empty
                elif .github_issue_number < 1 or .github_issue_number > 9007199254740991 then empty
                elif (.github_issue_number | floor) != .github_issue_number then empty
                else .github_issue_number | tostring
                end
              ' .sentinel/reports/triage-gate.json || true)"
              if [[ "$selected_issue" =~ ^[1-9][0-9]*$ ]]; then
                echo "- Work source: GitHub issue"
                echo "- Selected GitHub issue: #$selected_issue"
              fi
            fi
            if [ -f .sentinel/reports/github-issue-production-outcome.json ]; then
              jq -r '
                if .outcome == "kept" then "- GitHub issue production outcome: kept"
                elif .outcome == "rolled_back" then "- GitHub issue production outcome: rolled back"
                else empty
                end
              ' .sentinel/reports/github-issue-production-outcome.json
            fi
            if [ -f .sentinel/reports/failure.json ]; then
              jq -r '
                "- Failure: " + (.codex_failure // .error_class // "unavailable"),
                "- Codex duration: " + (if .codex_duration_ms == null then "unavailable" else ((.codex_duration_ms / 1000 | floor | tostring) + " seconds") end),
                "- Codex output retained: metadata only; stdout and stderr remain private"
              ' .sentinel/reports/failure.json
            fi
            for preservation in .sentinel/reports/failed-*-preservation.json; do
              if [ -f "$preservation" ]; then
                jq -r '"- Failed candidate preserved in encrypted evidence: " + (.candidate.preserved | tostring)' "$preservation"
              fi
            done
            echo "- Evidence artifact: encrypted AES-256-GCM ciphertext only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt and scrub Sentinel evidence
        if: always() && env.SENTINEL_PLAINTEXT_SAFE == 'true'
        shell: bash
        env:
          SENTINEL_ARTIFACT_KEY: ${{ secrets.SENTINEL_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          echo "SENTINEL_ARTIFACTS_SAFE=false" >> "$GITHUB_ENV"
          deno run \
            --allow-env=GITHUB_ACTIONS,SENTINEL_ARTIFACT_KEY \
            --allow-read=.sentinel/raw-logs,.sentinel/reports,.sentinel/encrypted \
            --allow-write=.sentinel \
            scripts/sentinel/encrypt-artifacts.ts
          test ! -e .sentinel/raw-logs
          test ! -e .sentinel/reports
          test ! -e .sentinel/candidate-worktree
          test ! -e .sentinel/private
          test -f .sentinel/encrypted/sentinel-evidence-v1.json
          echo "SENTINEL_ARTIFACTS_SAFE=true" >> "$GITHUB_ENV"

      - name: Upload encrypted Sentinel evidence
        if: >-
          always() &&
          env.SENTINEL_ARTIFACTS_SAFE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SENTINEL_EVIDENCE_ARTIFACT_NAME || format('sentinel-evidence-failed-before-dedupe-{0}', github.run_id) }}
          path: .sentinel/encrypted/sentinel-evidence-v1.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload encrypted replay bundle
        if: >-
          always() &&
          env.SENTINEL_ARTIFACTS_SAFE == 'true' &&
          env.SENTINEL_HAS_REPLAY_CASES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SENTINEL_REPLAY_BUNDLE_ARTIFACT_NAME }}
          path: |
            .sentinel/replay-cases
            .sentinel/replay-index
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Defer incident after infrastructure failure
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.sentinel_mode == 'incident' &&
          steps.incident-claim.outcome == 'success' &&
          (
            steps.sentinel-run.outcome == 'skipped' ||
            steps.incident-deferral-classification.outputs.reason != '' ||
            (steps.sentinel-run.outcome == 'success' && failure())
          )
        shell: bash
        env:
          CLASSIFIED_REASON: ${{ steps.incident-deferral-classification.outputs.reason }}
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          SENTINEL_INCIDENT_ID: ${{ inputs.incident_id }}
          SENTINEL_INCIDENT_ATTEMPT: ${{ inputs.incident_attempt }}
          SENTINEL_INCIDENT_ACK_NONCE: ${{ inputs.incident_ack_nonce }}
        run: |
          set -euo pipefail
          deferral_reason="${CLASSIFIED_REASON:-sentinel_infrastructure_preflight_failed}"
          case "$deferral_reason" in
            codex_auth_preflight_failed|sentinel_infrastructure_preflight_failed) ;;
            *)
              echo "::error::Incident infrastructure deferral reason is invalid."
              exit 1
              ;;
          esac
          response_file="$RUNNER_TEMP/sentinel-defer-response"
          response_headers="$RUNNER_TEMP/sentinel-defer-headers"
          request_body="$(
            jq -cn \
              --arg incident_id "$SENTINEL_INCIDENT_ID" \
              --arg attempt "$SENTINEL_INCIDENT_ATTEMPT" \
              --arg workflow_run_id "$GITHUB_RUN_ID" \
              --arg ack_nonce "$SENTINEL_INCIDENT_ACK_NONCE" \
              --arg reason "$deferral_reason" \
              '{
                incident_id: $incident_id,
                attempt: ($attempt | tonumber),
                workflow_run_id: ($workflow_run_id | tonumber),
                ack_nonce: $ack_nonce,
                reason: $reason
              }'
          )"
          for request_attempt in 1 2 3; do
            set +e
            status="$(
              curl \
                --silent \
                --show-error \
                --max-time 20 \
                --dump-header "$response_headers" \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
                --header "Content-Type: application/json" \
                --data "$request_body" \
                https://ai-ubq-fi.ubiquity-dao.deno.net/admin/sentinel/incidents/defer
            )"
            curl_status=$?
            set -e
            if [ "$curl_status" = "0" ] && [ "$status" = "204" ]; then
              disposition="$(
                tr -d '\r' < "$response_headers" | \
                  awk -F': ' 'tolower($1) == "x-sentinel-incident-disposition" { value=$2 } END { print value }'
              )"
              case "$disposition" in
                deferred)
                  echo "Incident infrastructure failure was durably deferred without consuming its repair attempt." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                dead_letter)
                  echo "::error::Incident exhausted its infrastructure deferral budget and was dead-lettered."
                  exit 1
                  ;;
                *)
                  echo "::error::Incident deferral returned an invalid disposition."
                  exit 1
                  ;;
              esac
            fi
            if [ "$request_attempt" -lt 3 ] && {
              [ "$curl_status" != "0" ] || [[ "$status" =~ ^5[0-9][0-9]$ ]];
            }; then
              sleep "$request_attempt"
              continue
            fi
            echo "::error::Incident infrastructure deferral failed (curl=$curl_status HTTP=$status)."
            exit 1
          done
          echo "::error::Incident infrastructure deferral exhausted its request retry bound."
          exit 1

      - name: Acknowledge completed incident
        if: success() && env.SENTINEL_MODE == 'incident'
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          deno eval \
            '
              const incidentId = Deno.env.get("SENTINEL_INCIDENT_ID");
              const attempt = Number(Deno.env.get("SENTINEL_INCIDENT_ATTEMPT"));
              const workflowRunId = Number(Deno.env.get("GITHUB_RUN_ID"));
              const ackNonce = Deno.env.get("SENTINEL_INCIDENT_ACK_NONCE");
              const token = Deno.env.get("DENO_DEPLOY_TOKEN");
              if (
                !incidentId || !Number.isSafeInteger(attempt) || !Number.isSafeInteger(workflowRunId) ||
                !ackNonce || !/^[A-Za-z0-9_-]{43}$/.test(ackNonce) || !token
              ) {
                throw new Error("Incident acknowledgement environment is invalid");
              }
              const response = await fetch(
                "https://ai-ubq-fi.ubiquity-dao.deno.net/admin/sentinel/incidents/ack",
                {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${token}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    incident_id: incidentId,
                    attempt,
                    workflow_run_id: workflowRunId,
                    ack_nonce: ackNonce,
                  }),
                  signal: AbortSignal.timeout(20_000),
                },
              );
              if (response.status !== 204) {
                await response.body?.cancel().catch(() => {});
                throw new Error(`Incident acknowledgement failed with HTTP ${response.status}`);
              }
            '
