name: PR 127 Final Codex Regression

on:
  push:
    branches:
      - feature/recent-model-context-windows

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/recent-model-context-windows
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.5
      - name: Apply Codex regression fix and validate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/openai-compat.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = 'assert.equal(model.auto_compact_token_limit_tokens, null);';
          const after = 'assert.equal(model.auto_compact_token_limit_tokens, 222000);';
          if (!source.includes(before)) throw new Error('capabilities regression anchor missing');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          deno fmt tests/openai-compat.test.ts
          deno fmt --check
          deno lint
          deno task build
          deno task test
      - name: Commit fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/pr127-test-regression-final.yml
          git add -A .github/workflows/pr127-test-regression-final.yml tests/openai-compat.test.ts
          git commit -m 'test(models): expect derived Codex compaction threshold'
          git pull --rebase origin feature/recent-model-context-windows
          git push origin HEAD:feature/recent-model-context-windows
