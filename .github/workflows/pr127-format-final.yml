name: PR 127 One-shot Format Validation

on:
  push:
    branches:
      - feature/recent-model-context-windows

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/recent-model-context-windows
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.5
      - name: Merge current base, repair inherited checks, and validate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin development
          git merge --no-edit origin/development
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/sentinel-issue-delivery.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          for (const [before, after] of [
            ['listOpenIssues: async () => [issue]', 'listOpenIssues: () => Promise.resolve([issue])'],
            ['getIssue: async () => issue', 'getIssue: () => Promise.resolve(issue)'],
            ['getIssueRelations: async () => relations', 'getIssueRelations: () => Promise.resolve(relations)'],
            ['getRepositoryPermission: async () => "write" as const', 'getRepositoryPermission: () => Promise.resolve("write" as const)'],
          ]) {
            if (!source.includes(before)) throw new Error(`missing lint repair anchor: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          deno fmt \
            tests/sentinel-issue-delivery.test.ts \
            scripts/sentinel/issue-pr-pre-push.ts \
            scripts/sentinel/issue-delivery.ts \
            scripts/sentinel/issue-delivery-reconcile.ts
          deno fmt --check
          deno lint
          deno task build
          deno task test
      - name: Commit merged validation fixes and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr127-format-final.yml
          git add -A \
            .github/workflows/pr127-format-final.yml \
            tests/sentinel-issue-delivery.test.ts \
            scripts/sentinel/issue-pr-pre-push.ts \
            scripts/sentinel/issue-delivery.ts \
            scripts/sentinel/issue-delivery-reconcile.ts
          git commit -m 'fix(sentinel): satisfy merged-tree validation'
          git push origin HEAD:feature/recent-model-context-windows
