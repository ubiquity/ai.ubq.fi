name: Remove Context Snapshot Scaffolding

on:
  push:
    branches:
      - feature/recent-model-reasoning-levels

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/snapshot-recent-model-contexts.yml \
            .github/workflows/cleanup-context-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "chore(models): remove snapshot scaffolding [context snapshot]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
