name: Finalize Recent Model Capabilities

on:
  push:
    branches:
      - feature/recent-model-reasoning-levels
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recent-model-capabilities-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[capability finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.5
      - name: Apply backend wiring
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/wire-recent-model-capabilities.ts ]; then
            deno run --allow-read=src/openai.ts --allow-write=src/openai.ts \
              scripts/wire-recent-model-capabilities.ts
          fi
      - name: Remove one-shot scaffolding
        shell: bash
        run: |
          rm -f \
            scripts/wire-recent-model-capabilities.ts \
            .github/workflows/wire-recent-model-capabilities.yml \
            .github/workflows/snapshot-recent-model-contexts.yml \
            .github/workflows/cleanup-context-snapshot.yml \
            .github/workflows/post-context-audit.yml \
            .github/workflows/finalize-recent-model-capabilities.yml
      - name: Format
        run: deno fmt serve.ts src tests scripts docs static
      - name: Validate formatting
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Build
        run: deno task build
      - name: Test
        run: deno task test
      - name: Commit finalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(models): publish context and compaction capabilities [capability finalized]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish audit to pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## Recent model context and compaction audit"
            echo
            echo "Full formatting, lint, build, and test validation passed for the finalized implementation."
            echo
            cat docs/recent-model-context-audit.md
          } > /tmp/context-audit-comment.md
          gh pr comment 126 --body-file /tmp/context-audit-comment.md
