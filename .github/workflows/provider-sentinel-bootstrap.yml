name: Provider Sentinel Bootstrap
run-name: Provider Sentinel Bootstrap ${{ github.event_name }} ${{ github.run_id }}

on:
  schedule:
    # Same rapid five-minute cadence as the evolving Sentinel workflow, staggered by two
    # minutes so bootstrap evaluation never fires in the same scheduled minute as the main
    # cycle. Each workflow keeps its own serializing, non-cancelling concurrency group.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: provider-sentinel-bootstrap-${{ github.repository }}
  cancel-in-progress: false

# Bootstrap writes only refs/heads/sentinel/bootstrap-state with fast-forward
# compare-and-swap commits. It has no
# pull-request, issue, deployment, promotion, or repository-history write path.
permissions:
  actions: write
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable execution SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bootstrap must always load the exact frozen execution SHA, never the
          # moving development tip, and leaves no credentials behind.
          ref: 8ba8c8d878a5f50004c5835f7d36d79e54d3f4f1
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5

      - name: Verify protected bootstrap package manifest
        shell: bash
        run: |
          set -euo pipefail
          # Every regular file below the frozen package is covered recursively;
          # no symlink may redirect the manifest outside the package.
          if [ -n "$(find scripts/sentinel/bootstrap -type l -print -quit)" ]; then
            echo "::error::Protected bootstrap package contains a symlink."
            exit 1
          fi
          expected="133ac04bc5fd4a7cee903bd2c94e1d12bcc250faf3c0b523f311c2d40fb8fb5f"
          actual="$(find scripts/sentinel/bootstrap -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Protected bootstrap package manifest mismatch."
            exit 1
          fi
          echo "Protected bootstrap package manifest verified."

      - name: Reconcile protected bootstrap state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          deno run \
            --no-config \
            --no-lock \
            --cached-only \
            --allow-env=GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_WORKFLOW_REF \
            --allow-net=api.github.com \
            scripts/sentinel/bootstrap/main.ts
