name: Context Catalog Audit

on:
  pull_request:
  push:
    branches:
      - feature/recent-model-context-windows

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live public catalog
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error \
            -A 'Mozilla/5.0 (compatible; ai.ubq.fi catalog audit)' \
            -H 'Accept: application/json' \
            https://ai.ubq.fi/uos/models/catalog \
            > catalog.json; then
            curl --fail --silent --show-error \
              https://r.jina.ai/http://ai.ubq.fi/uos/models/catalog \
              > catalog.json
          fi
          cat catalog.json
