name: Catalog Audit

on:
  push:
    branches:
      - feature/recent-model-reasoning-levels

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live catalog
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Accept: application/json' \
            https://ai.ubq.fi/uos/models/catalog \
            | jq -c '.data[] | {id,created,owned_by,supported_reasoning_levels,providers}'
