<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UbiquityOS — AI Chat Playground</title>
    <meta
      name="description"
      content="Browser chat playground for ai.ubq.fi (/v1/chat/completions). Stores your gateway token in localStorage only if you opt in."
    />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body data-page="chat" data-role="public">
    <div data-chat-shell>
      <aside data-chat-sidebar aria-label="Chat settings">
        <header data-chat-sidebar-header>
          <div data-brand>
          <a data-brand-link href="/">
            <svg data-logo viewBox="0 0 96 96" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M90.245 26.095c0-1.471-.832-2.878-2.111-3.646L50.201.576A4.03 4.03 0 0 0 48.091 0c-.704 0-1.472.192-2.111.576L8.11 22.449C6.833 23.216 6 24.559 6 26.095v43.81c0 1.471.832 2.879 2.11 3.646l37.934 21.873a4.04 4.04 0 0 0 4.157 0l37.933-21.873c1.28-.767 2.11-2.11 2.11-3.646zm-7.612 39.973c0 1.727-.896 3.326-2.367 4.157L50.457 87.814c-.703.447-1.535.639-2.367.639-.831 0-1.599-.192-2.366-.64l-29.81-17.588c-1.47-.831-2.366-2.43-2.366-4.157V34.409c0-.767.384-1.535 1.088-1.919a2.2 2.2 0 0 1 2.175 0l5.117 3.006c1.215.704 1.919 2.11 2.814 3.71.192.32.32.64.512.895 2.239 4.03 3.326 8.315 4.35 12.472 1.919 7.61 3.838 15.478 13.625 18.036 3.198.831 6.653.831 9.85 0 9.724-2.558 11.707-10.425 13.626-18.036 1.023-4.157 2.11-8.442 4.35-12.472.192-.32.32-.64.511-.895.832-1.6 1.6-2.942 2.815-3.71l5.117-3.006c.64-.383 1.472-.383 2.175 0 .704.384 1.088 1.088 1.088 1.92v31.658zM45.852 8.57a4.45 4.45 0 0 1 4.541 0l25.78 15.286c.639.384 1.023.64 1.023 1.407 0 .768-.384 1.215-1.024 1.6l-4.925 2.941c-2.175 1.28-3.263 3.326-4.222 5.18l-.064.129c-.128.255-.256.447-.384.703-2.43 4.35-4.222 8.954-5.245 13.047-2.047 7.931-2.815 13.176-9.468 14.903-1.215.32-2.494.447-3.71.447-1.279 0-2.494-.192-3.71-.447-6.652-1.727-7.484-6.972-9.467-14.966-1.023-4.094-2.814-8.699-5.245-13.048-.128-.192-.256-.448-.384-.64l-.064-.191c-.96-1.791-2.11-3.902-4.222-5.18l-4.925-2.943c-.64-.384-1.024-.831-1.024-1.599 0-.767.384-1.023 1.024-1.407z"
              />
            </svg>
            <span>UbiquityOS</span>
          </a>
            <span data-muted>/ AI Gateway</span>
          </div>
          <nav data-chat-nav aria-label="Primary">
            <a data-button href="/">Docs</a>
            <a data-button href="/admin">Admin</a>
          </nav>
        </header>

        <div data-chat-sidebar-actions>
          <button id="reset-chat" type="button" data-icon-button aria-label="New chat" title="New chat">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>

        <div data-chat-sidebar-body>
          <details data-chat-panel data-panel-key="auth" open>
            <summary>Auth</summary>
            <div data-panel-body>
              <label data-field>
                <span data-label>Gateway token</span>
                <input
                  id="token"
                  type="password"
                  inputmode="text"
                  autocomplete="off"
                  placeholder="Paste token (used as Authorization: Bearer ...)"
                />
              </label>
              <div data-layout="row">
                <label data-check>
                  <input id="remember-token" type="checkbox" />
                  <span>Remember</span>
                </label>
                <label data-check>
                  <input id="show-token" type="checkbox" />
                  <span>Show</span>
                </label>
              </div>
              <span id="auth-badge" data-badge data-state="unknown">Not checked</span>
              <p data-help data-tone="warning">Remember stores the token in this browser's localStorage in cleartext.</p>
              <p data-help>Token checks run automatically after edits.</p>
            </div>
          </details>

          <details data-chat-panel data-panel-key="request" open>
            <summary>Request</summary>
            <div data-panel-body>
              <label data-field>
                <span data-label>Model</span>
                <select id="model">
                  <option value="">Loading models...</option>
                </select>
              </label>
              <label data-field>
                <span data-label>Reasoning effort</span>
                <select id="reasoning-effort">
                  <option value="">Default</option>
                  <option value="none">none</option>
                  <option value="minimal">minimal</option>
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high">high</option>
                  <option value="xhigh">xhigh</option>
                </select>
              </label>
              <label data-field>
                <span data-label>System prompt (optional)</span>
                <textarea id="system" rows="4" placeholder="You are a helpful assistant."></textarea>
              </label>
            </div>
          </details>
        </div>
      </aside>

      <main data-chat-main>
        <header data-chat-topbar>
          <div>
            <h1>AI Chat Playground</h1>
            <p data-chat-subtitle>Test <code>/v1/chat/completions</code> from your browser.</p>
          </div>
        </header>

        <div id="messages" data-messages role="log" aria-live="polite"></div>

        <form id="chat-form" data-chat-form autocomplete="off">
          <div data-chat-compose>
            <textarea
              id="prompt"
              rows="3"
              placeholder="Message... (Enter to send, Shift+Enter for newline)"
            ></textarea>
            <div data-chat-compose-actions>
              <button id="stop" type="button" data-icon-button aria-label="Stop" title="Stop" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="7" y="7" width="10" height="10" rx="2" ry="2" />
                </svg>
              </button>
              <button
                id="send"
                type="submit"
                data-variant="primary"
                data-icon-button
                aria-label="Send"
                title="Send"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M21 3L10 14" />
                  <path d="M21 3l-7 18-4-8-8-4 19-6z" />
                </svg>
              </button>
            </div>
          </div>
        </form>
      </main>
    </div>
    <script type="module" src="/chat.js"></script>
  </body>
</html>
