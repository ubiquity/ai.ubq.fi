<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UbiquityOS — AI Chat Playground</title>
    <meta
      name="description"
      content="Browser chat playground for ai.ubq.fi (/v1/chat/completions). Stores your gateway token in localStorage only if you opt in."
    />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
    <link rel="stylesheet" href="/style.css?v=public-console-20260903-v6" />
    <link rel="stylesheet" href="/chat.css?v=public-console-20260903-v6" />
  </head>
  <body data-page="chat" data-role="public">
    <div data-chat-shell>
      <header data-shared-header>
        <div data-brand>
          <a data-brand-link href="/">
            <svg data-logo viewBox="0 0 96 96" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M90.245 26.095c0-1.471-.832-2.878-2.111-3.646L50.201.576A4.03 4.03 0 0 0 48.091 0c-.704 0-1.472.192-2.111.576L8.11 22.449C6.833 23.216 6 24.559 6 26.095v43.81c0 1.471.832 2.879 2.11 3.646l37.934 21.873a4.04 4.04 0 0 0 4.157 0l37.933-21.873c1.28-.767 2.11-2.11 2.11-3.646zm-7.612 39.973c0 1.727-.896 3.326-2.367 4.157L50.457 87.814c-.703.447-1.535.639-2.367.639-.831 0-1.599-.192-2.366-.64l-29.81-17.588c-1.47-.831-2.366-2.43-2.366-4.157V34.409c0-.767.384-1.535 1.088-1.919a2.2 2.2 0 0 1 2.175 0l5.117 3.006c1.215.704 1.919 2.11 2.814 3.71.192.32.32.64.512.895 2.239 4.03 3.326 8.315 4.35 12.472 1.919 7.61 3.838 15.478 13.625 18.036 3.198.831 6.653.831 9.85 0 9.724-2.558 11.707-10.425 13.626-18.036 1.023-4.157 2.11-8.442 4.35-12.472.192-.32.32-.64.511-.895.832-1.6 1.6-2.942 2.815-3.71l5.117-3.006c.64-.383 1.472-.383 2.175 0 .704.384 1.088 1.088 1.088 1.92v31.658zM45.852 8.57a4.45 4.45 0 0 1 4.541 0l25.78 15.286c.639.384 1.023.64 1.023 1.407 0 .768-.384 1.215-1.024 1.6l-4.925 2.941c-2.175 1.28-3.263 3.326-4.222 5.18l-.064.129c-.128.255-.256.447-.384.703-2.43 4.35-4.222 8.954-5.245 13.047-2.047 7.931-2.815 13.176-9.468 14.903-1.215.32-2.494.447-3.71.447-1.279 0-2.494-.192-3.71-.447-6.652-1.727-7.484-6.972-9.467-14.966-1.023-4.094-2.814-8.699-5.245-13.048-.128-.192-.256-.448-.384-.64l-.064-.191c-.96-1.791-2.11-3.902-4.222-5.18l-4.925-2.943c-.64-.384-1.024-.831-1.024-1.599 0-.767.384-1.023 1.024-1.407z"
              />
            </svg>
            <span>UbiquityOS</span>
          </a>
          <span data-muted>/ AI Gateway</span>
        </div>
        <nav data-actions aria-label="Primary">
          <a data-button href="/models">Models</a>
          <a data-button href="/developers">Developers</a>
          <a data-button href="/docs">Docs</a>
          <a data-button aria-current="page" href="/chat">Chat</a>
          <a data-button href="/admin">Admin</a>
        </nav>
      </header>

      <aside data-chat-sidebar aria-label="Chat settings">
        <div data-chat-sidebar-actions>
          <button
            id="reset-chat"
            type="button"
            data-icon-button
            data-tooltip="Start a new conversation"
            aria-label="New chat"
          >
            <svg data-material-icon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
          </button>
        </div>

        <div data-chat-sidebar-body>
          <details data-chat-panel data-panel-key="auth" open>
            <summary>Auth</summary>
            <div data-panel-body>
              <div data-layout="row">
                <button
                  id="passkey-login"
                  type="button"
                  data-tooltip="Use iCloud Keychain or another passkey provider to sign in"
                >
                  <svg data-material-icon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.5 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.24.13.34.42.21.67-.09.18-.26.28-.44.28zm-14.31 5.25c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27 3.15-1.63 7.16-1.64 10.32-.01 1.5.77 2.76 1.86 3.75 3.25.16.22.11.54-.12.7-.23.16-.54.11-.7-.12-.9-1.26-2.04-2.25-3.39-2.94-2.87-1.48-6.54-1.48-9.4.01-1.36.7-2.5 1.7-3.4 2.96-.08.14-.23.21-.4.21zm6.25 12.07c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39s-4.66 1.97-4.66 4.39c0 1.44.32 2.77.93 3.85.64 1.15 1.08 1.64 1.85 2.42.2.2.2.51 0 .71-.11.1-.24.15-.37.15zm7.17-1.85c-1.19 0-2.24-.3-3.1-.89-1.49-1.01-2.38-2.65-2.38-4.39 0-.28.22-.5.5-.5s.5.22.5.5c0 1.41.72 2.74 1.94 3.56.71.48 1.56.72 2.54.72.23 0 .62-.03 1.01-.1.27-.05.53.13.58.41.05.27-.13.53-.41.58-.56.11-1.06.11-1.18.11zM14.91 22c-.04 0-.09-.01-.13-.02-1.59-.44-2.63-1.03-3.72-2.1-1.4-1.39-2.17-3.24-2.17-5.22 0-1.62 1.38-2.94 3.08-2.94s3.08 1.32 3.08 2.94c0 1.07.93 1.94 2.08 1.94s2.08-.87 2.08-1.94c0-3.77-3.24-6.83-7.23-6.83s-7.23 3.06-7.23 6.83c0 2.55.75 4.64 2.44 6.78.17.22.13.53-.08.7-.22.17-.53.13-.7-.08-1.83-2.32-2.65-4.62-2.65-7.4 0-4.32 3.69-7.83 8.23-7.83s8.23 3.51 8.23 7.83c0 1.62-1.38 2.94-3.08 2.94s-3.08-1.32-3.08-2.94c0-1.07-.93-1.94-2.08-1.94s-2.08.87-2.08 1.94c0 1.71.66 3.31 1.87 4.52.95.94 1.86 1.46 3.27 1.85.27.07.42.35.35.61-.05.22-.26.37-.48.37z"
                    />
                  </svg>
                  <span>Sign in with passkey</span>
                </button>
                <button
                  id="passkey-register"
                  type="button"
                  data-tooltip="Create a passkey for this account on the current domain"
                >
                  <svg data-material-icon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zM7 20v-2c0-2.67 5.33-4 8-4 .32 0 .7.02 1.1.07-.7.86-1.1 1.94-1.1 3.13V20H7zm12-3v-3h-2v3h-3v2h3v3h2v-3h3v-2h-3z"
                    />
                  </svg>
                  <span>Add passkey</span>
                </button>
                <button id="sign-out" type="button" data-tooltip="Clear this browser session" hidden>
                  <svg data-material-icon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M17 7 15.59 8.41 18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                    />
                  </svg>
                  <span>Sign out</span>
                </button>
              </div>
              <span id="passkey-status" data-badge data-state="unknown">Passkey idle</span>
              <details data-passkey-advanced>
                <summary>Advanced passkey options</summary>
                <div data-passkey-advanced-body>
                  <label data-field>
                    <span data-label>Username</span>
                    <input
                      id="passkey-handle"
                      type="text"
                      inputmode="text"
                      autocomplete="off"
                      placeholder="Optional account name"
                    />
                  </label>
                </div>
              </details>
              <details data-token-fallback>
                <summary>Fallback gateway token</summary>
                <div data-token-fallback-body>
                  <label data-field>
                    <span data-label>Gateway token</span>
                    <input
                      id="token"
                      type="password"
                      inputmode="text"
                      autocomplete="off"
                      placeholder="Paste gateway token"
                    />
                  </label>
                  <div data-layout="row">
                    <label data-check>
                      <input id="remember-token" type="checkbox" />
                      <span>Remember</span>
                    </label>
                    <label data-check>
                      <input id="show-token" type="checkbox" />
                      <span>Show</span>
                    </label>
                  </div>
                  <span id="auth-badge" data-badge data-state="unknown">Not checked</span>
                </div>
              </details>
            </div>
          </details>

          <details data-chat-panel data-panel-key="request" open>
            <summary>Request</summary>
            <div data-panel-body>
              <label data-field>
                <span data-label>Model</span>
                <select id="model">
                  <option value="">Loading models...</option>
                </select>
              </label>
              <label data-field>
                <span data-label>Reasoning effort</span>
                <select id="reasoning-effort">
                  <option value="">Loading models...</option>
                </select>
              </label>
              <div data-layout="row">
                <label data-check>
                  <input id="stream" type="checkbox" checked />
                  <span>Stream response</span>
                </label>
                <span id="stream-hint" data-muted hidden>GPT-OSS 120B requires streaming off</span>
              </div>
              <label data-field>
                <span data-label>System prompt (optional)</span>
                <textarea id="system" rows="4" placeholder="You are a helpful assistant."></textarea>
              </label>
            </div>
          </details>
        </div>
      </aside>

      <main data-chat-main>
        <header data-chat-topbar>
          <div>
            <h1>AI Chat Playground</h1>
            <p data-chat-subtitle>Test <code>/v1/chat/completions</code> from your browser.</p>
          </div>
        </header>

        <div id="messages" data-messages role="log" aria-live="polite"></div>

        <form id="chat-form" data-chat-form autocomplete="off">
          <div data-chat-compose>
            <textarea
              id="prompt"
              rows="3"
              placeholder="Message... (Enter to send, Shift+Enter for newline)"
            ></textarea>
            <div data-chat-compose-actions>
              <button
                id="stop"
                type="button"
                data-icon-button
                data-tooltip="Stop the current response"
                aria-label="Stop"
                disabled
              >
                <svg data-material-icon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M6 6h12v12H6z" />
                </svg>
              </button>
              <button
                id="send"
                type="submit"
                data-variant="primary"
                data-icon-button
                data-tooltip="Send message"
                aria-label="Send"
              >
                <svg data-material-icon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
                </svg>
              </button>
            </div>
          </div>
        </form>
        <div data-chat-stats role="status" aria-live="polite" aria-atomic="true" hidden></div>
      </main>
    </div>
    <script type="module" src="/chat.js?v=20260903-chat-motion-v1"></script>
  </body>
</html>
