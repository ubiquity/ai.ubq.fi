[package]
name = "gateway-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
native-import-fixture = ["gateway-authority/native-import-fixture"]

[dependencies]
gateway-native-authority-wire.workspace = true
gateway-cache-experiment-records = { path = "../gateway-cache-experiment-records" }
gateway-authority-contracts = { path = "../gateway-authority-contracts" }
gateway-authority-paid-control-records = { path = "../gateway-authority-paid-control-records" }
gateway-authority-keys = { path = "../gateway-authority-keys" }
gateway-authority-routing-records = { path = "../gateway-authority-routing-records" }
gateway-auth-native-wire.workspace = true
gateway-auth-native-contracts.workspace = true
gateway-auth-native-proof.workspace = true
gateway-auth-native-protocol.workspace = true
gateway-source.workspace = true
gateway-core = { path = "../gateway-core" }
gateway-authority = { path = "../gateway-authority" }
gateway-publication = { path = "../gateway-publication" }
gateway-native-confinement.workspace = true
gateway-native-connector.workspace = true
gateway-native-connected-io.workspace = true
gateway-native-custody-wire.workspace = true
gateway-native-http-framing.workspace = true
gateway-native-import-client.workspace = true
gateway-native-import-source.workspace = true
gateway-native-live-buffer.workspace = true
gateway-native-local-transport.workspace = true
gateway-native-replay.workspace = true
gateway-native-supervisor.workspace = true
gateway-native-supervisor-data.workspace = true
gateway-native-supervisor-http.workspace = true
gateway-publication-policy.workspace = true
gateway-publication-transport.workspace = true
gateway-auth-contracts.workspace = true
gateway-auth-credentials.workspace = true
gateway-auth-native-import-data.workspace = true
gateway-auth-passkeys.workspace = true
gateway-auth-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { version = "=0.3.44", features = ["parsing", "formatting"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["net", "time", "fs", "process", "event"] }
getrandom = "=0.4.3"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
socket2 = "=0.6.5"
futures-executor = "=0.3.34"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
httparse = "=1.10.1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.9"

[[bin]]
name = "uos-native"
path = "src/bin/uos-native.rs"

[target.'cfg(target_os = "linux")'.dev-dependencies]
landlock = "=0.4.7"

[dev-dependencies]
gateway-native-https-test-support.workspace = true
gateway-native-import-test-support.workspace = true

[lints]
workspace = true

[[example]]
name = "uos-native-connector-fixture"
path = "tests/support/connector_fixture.rs"

[[bin]]
name = "uos-native-supervisor"
path = "src/bin/uos-native-supervisor.rs"

[[bin]]
name = "uos-native-request"
path = "src/bin/uos-native-request.rs"

[[bin]]
name = "uos-native-connector"
path = "src/bin/uos-native-connector.rs"

[[bin]]
name = "uos-native-import"
path = "src/bin/uos-native-import.rs"

[[example]]
name = "uos-native-import-fixture"
path = "tests/support/import_fixture.rs"
required-features = ["native-import-fixture"]
