[package]
name = "gateway-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gateway-kv-codec.workspace = true
gateway-contracts.workspace = true
gateway-source = { path = "../gateway-source" }
gateway-auth-passport-sessions = { path = "../gateway-auth-passport-sessions" }
gateway-auth-attestation = { path = "../gateway-auth-attestation" }
gateway-auth-contracts = { path = "../gateway-auth-contracts" }
gateway-auth-credentials = { path = "../gateway-auth-credentials" }
gateway-auth-native-contracts = { path = "../gateway-auth-native-contracts" }
gateway-auth-native-import-data = { path = "../gateway-auth-native-import-data" }
gateway-auth-native-proof = { path = "../gateway-auth-native-proof" }
gateway-auth-native-protocol = { path = "../gateway-auth-native-protocol" }
gateway-auth-passkeys = { path = "../gateway-auth-passkeys" }
gateway-auth-passport = { path = "../gateway-auth-passport" }
gateway-auth-passport-contracts = { path = "../gateway-auth-passport-contracts" }
gateway-auth-primitives = { path = "../gateway-auth-primitives" }
gateway-auth-native-wire.workspace = true
gateway-core = { path = "../gateway-core" }
serde.workspace = true
serde_json.workspace = true
base64 = "=0.22.1"
sha2 = "=0.10.9"
hmac = "=0.12.1"
time = { version = "=0.3.44", features = ["parsing", "formatting"] }
url = "=2.5.8"
rsa = { version = "=0.9.10", features = ["sha2", "pem"] }
ciborium = "=0.2.2"
webauthn-rs-core = "=0.6.1-dev"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa"] }
p521 = { version = "=0.13.3", default-features = false, features = ["ecdsa"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.16", features = ["js"] }
getrandom03 = { package = "getrandom", version = "=0.3.4", features = ["wasm_js"] }
uuid = { version = "=1.28.0", features = ["js"] }


[lints]
workspace = true
