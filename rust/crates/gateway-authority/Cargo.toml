[package]
name = "gateway-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gateway-authority-api-release = { path = "../gateway-authority-api-release" }
gateway-authority-api-quota = { path = "../gateway-authority-api-quota" }
gateway-authority-api-protocol = { path = "../gateway-authority-api-protocol" }
gateway-authority-contracts = { path = "../gateway-authority-contracts" }
gateway-authority-paid-control-records = { path = "../gateway-authority-paid-control-records" }
gateway-cache-experiment-records = { path = "../gateway-cache-experiment-records" }
gateway-authority-keys = { path = "../gateway-authority-keys" }
gateway-authority-routing-records = { path = "../gateway-authority-routing-records" }
gateway-auth-native-wire.workspace = true
gateway-core = { path = "../gateway-core" }
gateway-auth = { path = "../gateway-auth" }
gateway-providers = { path = "../gateway-providers" }
gateway-schema = { path = "../gateway-schema" }
serde.workspace = true
serde_json.workspace = true
# Reuse the exact SHA-256 implementation already pinned in tools/native-kv/Cargo.lock.
sha2 = "=0.11.0"

[dev-dependencies]
gateway-authority-test-support = { path = "../gateway-authority-test-support" }
gateway-routing-runtime-test-support.workspace = true

[target.'cfg(unix)'.dependencies]
getrandom = "=0.4.3"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[target.'cfg(unix)'.dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }

[features]
default = []
native-import-fixture = []

[lints]
workspace = true
