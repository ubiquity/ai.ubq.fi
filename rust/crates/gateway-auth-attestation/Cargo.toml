[package]
name = "gateway-auth-attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gateway-kv-codec.workspace = true
gateway-source = { path = "../gateway-source" }
gateway-auth-contracts = { path = "../gateway-auth-contracts" }
gateway-auth-primitives = { path = "../gateway-auth-primitives" }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
time = { version = "=0.3.44", features = ["parsing", "formatting"] }
rsa = { version = "=0.9.10", features = ["sha2", "pem"] }
ciborium = "=0.2.2"
webauthn-rs-core = "=0.6.1-dev"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa"] }
p521 = { version = "=0.13.3", default-features = false, features = ["ecdsa"] }

[lints]
workspace = true
