[package]
name = "gateway-migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gateway-authority-reset-records = { path = "../gateway-authority-reset-records" }
gateway-authority-paid-records = { path = "../gateway-authority-paid-records" }
gateway-authority-routing-evidence = { path = "../gateway-authority-routing-evidence" }
gateway-authority-kernel-protocol = { path = "../gateway-authority-kernel-protocol" }
gateway-authority-api-protocol = { path = "../gateway-authority-api-protocol" }
gateway-authority-paid-control-records = { path = "../gateway-authority-paid-control-records" }
gateway-authority-initial-owner = { path = "../gateway-authority-initial-owner" }
gateway-authority-keys = { path = "../gateway-authority-keys" }
gateway-authority-routing-records = { path = "../gateway-authority-routing-records" }
gateway-auth-native-wire.workspace = true
gateway-core = { path = "../gateway-core" }
gateway-observability.workspace = true
gateway-claude-runtime = { path = "../gateway-claude-runtime" }
gateway-auth = { path = "../gateway-auth" }
gateway-admin = { path = "../gateway-admin" }
gateway-admin-data = { path = "../gateway-admin-data" }
gateway-admin-runtime = { path = "../gateway-admin-runtime" }
gateway-authority = { path = "../gateway-authority" }
gateway-schema = { path = "../gateway-schema" }
gateway-routing-runtime = { path = "../gateway-routing-runtime" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
gateway-native = { path = "../gateway-native" }
sha2 = "=0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gateway-migration-test-support.workspace = true
gateway-native = { path = "../gateway-native" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[[example]]
name = "native-copied-store-inverse"
path = "tests/copied_store_inverse/native-copied-store-inverse.rs"

[[example]]
name = "native-offline-fixture"
path = "tests/support/native-offline-fixture.rs"

[[example]]
name = "offline-fixture"
path = "tests/support/offline-fixture.rs"

[[example]]
name = "worker-custody-fixture"
path = "tests/support/worker-custody-fixture.rs"

[lints]
workspace = true

[dev-dependencies]
gateway-authority-paid-ledger = { path = "../gateway-authority-paid-ledger" }
gateway-authority-routing-selection = { path = "../gateway-authority-routing-selection" }
gateway-authority-kernel = { path = "../gateway-authority-kernel" }
gateway-authority-api-release = { path = "../gateway-authority-api-release" }
gateway-authority-api-quota = { path = "../gateway-authority-api-quota" }
gateway-authority-contracts = { path = "../gateway-authority-contracts" }
