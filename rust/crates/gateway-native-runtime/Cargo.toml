[package]
name = "gateway-native-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gateway-core.workspace = true
gateway-auth.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["net", "time", "fs", "process", "event"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[target.'cfg(unix)'.dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }

[lints]
workspace = true
