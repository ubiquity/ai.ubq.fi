[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"

[profile.release-candidate]
inherits = "release"
lto = "thin"
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "deny"
unused_lifetimes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }

# Threshold 5 is configured in clippy.toml. Rust gates stage existing debt
# with --force-warn and the diagnostic baseline while preserving -D warnings.
excessive_nesting = "warn"

allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
webauthn-rs-core = { path = "vendor/webauthn-rs-core-0.6.1-dev" }
